<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>CARBON//DESIRE V11</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070609;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}button{font:inherit}.game{position:fixed;inset:0;background:#100b10}.hud{position:absolute;z-index:30;top:0;left:0;right:0;height:58px;background:#0c090dcc;display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #ffffff25}.title{font:700 17px Georgia;color:#f0aac0;margin-right:auto}.chip{background:#1f171b;border:1px solid #875b69;padding:6px 8px;font-size:11px}.xp{position:absolute;top:58px;left:0;right:0;height:4px;background:#281b21;z-index:31}.xp i{display:block;height:100%;background:#e997b0}.stage{position:absolute;inset:62px 0 0;overflow:hidden;background:#21191d}.scene{position:absolute;inset:0;background:linear-gradient(#0002,#0007),url(build07_ui.png) center/cover;transition:.3s}.room{position:absolute;left:4%;right:4%;top:6%;bottom:10%;border:2px solid #9b6b79;background:linear-gradient(180deg,#b57b8d 0 58%,#5a3b42 58%);box-shadow:inset 0 0 80px #0007}.window{position:absolute;left:8%;top:8%;width:26%;height:30%;background:linear-gradient(#704d82,#e8a2ba);border:8px solid #ead7dc}.bed{position:absolute;right:8%;bottom:12%;width:30%;height:25%;background:#ead5db;border:7px solid #56383f}.desk{position:absolute;left:8%;bottom:14%;width:28%;height:17%;background:#573940;border-top:7px solid #d3a6b1}.avatar{position:absolute;left:48%;bottom:18%;font-size:64px;filter:drop-shadow(0 5px 3px #0007)}.obj{position:absolute;z-index:5;border:0;background:#f8eef0e8;color:#25191e;padding:8px 10px;border-radius:12px;font-weight:800;box-shadow:0 3px 10px #0007}.obj small{display:block;font-size:9px}.map{position:absolute;inset:0;background:linear-gradient(#5d4152,#1c151a),url(world.png) center/cover}.place{position:absolute;transform:translate(-50%,-50%);border:2px solid #f2b1c5;background:#171014e8;color:white;padding:10px;border-radius:15px;font-weight:900}.place .ico{font-size:27px;display:block}.closed{opacity:.45}.dialogue{position:absolute;z-index:50;left:5%;right:5%;bottom:3%;min-height:27%;background:#120d11f2;border:2px solid #e18fa9;padding:17px 18px 13px;box-shadow:0 0 30px #000}.speaker{font:700 23px Georgia;color:#f0a8be}.line{font-size:19px;line-height:1.65;margin:7px 0 12px}.next{float:right;background:#e997b0;border:0;padding:9px 14px;font-weight:900}.choices button{display:block;width:100%;background:#f8edf0;border:0;padding:9px;margin:5px 0;text-align:left}.panel{position:absolute;z-index:70;inset:5%;background:#f6efec;color:#281e22;border:4px solid #171114;padding:16px;overflow:auto}.panel h2{margin-top:0}.close{float:right;position:sticky;top:0;background:#171114;color:#fff;border:0;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.card{background:white;border:1px solid #c39aa6;padding:12px;color:#2b2024}.heart{color:#d8507d;font-size:20px}.bar{height:8px;background:#e7dadd;margin:5px 0 10px}.bar i{display:block;height:100%;background:#df8da6}.phone{position:absolute;z-index:80;right:3%;top:8%;bottom:5%;width:min(400px,60vw);background:#f5efec;color:#241b1f;border:7px solid #171114;border-radius:28px;padding:16px;overflow:auto}.bubble{background:white;padding:9px 11px;border-radius:14px;margin:6px 0;line-height:1.5}.incoming{position:absolute;z-index:90;top:12%;left:50%;transform:translateX(-50%);background:#151014;border:2px solid #e997b0;padding:18px 24px;text-align:center;border-radius:18px}.incoming .who{font-size:25px;font-weight:900}.callbtn{border:0;padding:10px 17px;margin:8px;font-size:18px}.toast{position:absolute;z-index:100;top:75px;left:50%;transform:translateX(-50%);background:#151014eF;border:1px solid #e997b0;padding:10px 16px}.progress{position:absolute;z-index:35;left:10px;bottom:10px;background:#120d11dd;padding:8px;width:190px;font-size:10px}.hidden{display:none!important}@media(max-width:800px){.line{font-size:16px}.speaker{font-size:19px}.avatar{font-size:48px}.chip:nth-of-type(3){display:none}}
</style></head><body><div class="game"><div class="hud"><div class="title">CARBON//DESIRE · V11</div><div class="chip" id="day"></div><div class="chip" id="loc"></div><div class="chip" id="money"></div><button class="chip" onclick="openPhone()">📱</button><button class="chip" onclick="openPanel('status')">☰</button></div><div class="xp"><i id="xp"></i></div><div class="stage" id="stage"></div><div class="progress" id="progress"></div></div>
<script>
let W,G,V9;let S=JSON.parse(localStorage.getItem("cd11")||"null")||{day:1,hour:9,min:20,loc:"home",lv:1,xp:12,energy:82,mood:64,money:8560,knowledge:1,biz:1,quest:[18,20,12,8,5],rels:{ren:2,ayo:3,hk:1,meng:1,adrian:0,marco:0,khalid:0},trust:{ren:10,ayo:22,hk:8,meng:6,adrian:15,marco:28,khalid:20},flags:{},messages:[],inv:["3DS","培训笔记","碳纤样板","展会名片×7","006门卡"]};const $=q=>document.querySelector(q);
async function boot(){[W,G,V9]=await Promise.all([fetch("./v11_world.json?v=11").then(r=>r.json()),fetch("./v10_game.json?v=11").then(r=>r.json()),fetch("./v9_beginner.json?v=11").then(r=>r.json())]);tickUI();renderScene();setTimeout(()=>notify("Ayo","how's Guangzhou treating u"),1200);setTimeout(()=>incoming("Khalid"),4500)}
function save(){localStorage.setItem("cd11",JSON.stringify(S));tickUI()}function tickUI(){$("#day").textContent=`DAY ${S.day} · ${String(S.hour).padStart(2,"0")}:${String(S.min).padStart(2,"0")}`;$("#loc").textContent=W?W.locations.find(x=>x.id===S.loc)?.name||S.loc:S.loc;$("#money").textContent=`¥${S.money}`;$("#xp").style.width=S.xp+"%";$("#progress").innerHTML=`LV.${S.lv} · EXP ${S.xp}/100<br>培训 ${S.quest[0]}%<div class="bar"><i style="width:${S.quest[0]}%"></i></div>产品图鉴 ${S.quest[1]}%<div class="bar"><i style="width:${S.quest[1]}%"></i></div>`}function time(m){S.min+=m;while(S.min>=60){S.min-=60;S.hour++}if(S.hour>=24){S.hour%=24;S.day++;S.energy=Math.min(100,S.energy+25)}save()}function gain(x){S.xp+=x;while(S.xp>=100){S.xp-=100;S.lv++;toast(`LEVEL UP · LV.${S.lv}`)}save()}function renderScene(){tickUI();if(S.loc==="map"){renderMap();return}let L=W.locations.find(x=>x.id===S.loc);let bg=S.loc==="home"?`<div class="room"><div class="window"></div><div class="bed"></div><div class="desk"></div><div class="avatar">👩🏻</div></div>`:`<div class="room" style="background:linear-gradient(180deg,#3d3438 0 60%,#20181b 60%)"><div class="avatar">👩🏻</div></div>`;$("#stage").innerHTML=`<div class="scene">${bg}${objects()}${npcButtons()}</div>`}function objects(){let a=W.objects[S.loc]||[["🚪","离开","map"],["📱","手机","phone"]];let pos=[[10,72],[23,48],[72,62],[87,72],[48,22]];return a.map((o,i)=>`<button class="obj" style="left:${pos[i%pos.length][0]}%;top:${pos[i%pos.length][1]}%" onclick="objectAct('${o[2]}')">${o[0]}<small>${o[1]}</small></button>`).join("")}function npcButtons(){return G.characters.filter(c=>isHere(c.id)).map((c,i)=>`<button class="obj" style="right:${8+i*14}%;top:28%" onclick="talk('${c.id}')">${c.portrait}<small>${c.name}</small></button>`).join("")}function isHere(id){if(id==="ren"&&S.loc==="garage"&&S.hour>=10)return true;if(id==="marco"&&S.loc==="expo"&&S.hour>=10&&S.hour<17)return true;if(id==="meng"&&((S.loc==="expo"&&S.hour>=15)||(S.loc==="bar"&&S.hour>=21)))return true;return false}
function objectAct(a){if(a==="map"){S.loc="map";renderMap();return}if(a==="phone"){openPhone();return}if(a==="sleep"){dialogue("SERENA",["你把手机扔到枕头边。","今天到这里。明天还有车要认。"],()=>{S.day++;S.hour=8;S.min=30;S.energy=100;S.loc="home";save();renderScene()});return}if(a==="3ds"){S.mood=Math.min(100,S.mood+12);time(60);dialogue("SYSTEM",["你决定先玩一小时。工作群不会因为你盯着它就自己变简单。","心情 +12。"]);return}if(a==="lesson"){lesson();return}if(a==="business"){business();return}if(a==="g63"){g63();return}if(a==="partsbox"){dialogue("SERENA",["一箱黑色零件。脱离整车以后它们又开始长得一模一样。","先别猜名字。先找：它大概装在车头、车侧还是车尾？"]);return}if(a==="qc"){dialogue("WAREHOUSE",["验货第一步不是摸两下说“质量不错”。","拍标签、数量、正反面、安装位、边缘、附件、包装。"]);return}dialogue("SYSTEM",[a+"：这个交互将在后续事件继续扩展。"])}
function renderMap(){$("#stage").innerHTML=`<div class="map">${W.locations.map(l=>{let open=isOpen(l);return `<button class="place ${open?"":"closed"}" style="left:${l.x}%;top:${l.y}%" onclick="go('${l.id}')"><span class="ico">${l.icon}</span>${l.name}<small>${open?" OPEN":" CLOSED"}</small></button>`}).join("")}</div>`}function isOpen(l){return S.hour>=l.open[0]&&S.hour<l.open[1]}function go(id){let l=W.locations.find(x=>x.id===id);if(!isOpen(l)){toast(`${l.name} 现在关门`);return}S.loc=id;S.energy=Math.max(0,S.energy-3);time(25);renderScene()}
function dialogue(who,lines,done){let i=0;let box=document.createElement("div");box.className="dialogue";document.querySelector(".stage").appendChild(box);function draw(){box.innerHTML=`<div class="speaker">${who}</div><div class="line">${lines[i]}</div><button class="next">▼</button>`;box.querySelector(".next").onclick=()=>{i++;if(i>=lines.length){box.remove();done&&done();return}draw()}}draw()}
function talk(id){let c=G.characters.find(x=>x.id===id);let lines=id==="ren"?["you're late.","你低头看时间。你只迟到了四分钟。","Ren: four minutes is late.","Serena: then stop texting me to come here","Ren: come here. rear of the G63. point first, name second."]:id==="marco"?["Marco 把手机里一张安装缝隙的照片放大。","Marco: This is what I mean. Cheap part, expensive mechanic time.","Serena: gap issue? or mounting points?","Marco: Both on the last supplier.","Serena: then let's test the 2 SKUs u install most."]:["你们聊了一会。"];dialogue(c.name,lines,()=>{S.trust[id]=Math.min(100,(S.trust[id]||0)+4);if(["ren","meng"].includes(id))S.rels[id]=Math.min(5,(S.rels[id]||0)+1);time(20);gain(8)})}
function g63(){dialogue("REN",["don't name it yet. tell me where it is.","Serena: 车屁股最下面，排气附近。","Ren: good. now name it.","Serena: rear diffuser?","Ren: there u go.","你终于不是靠死背“后扩散器”四个字，而是先从位置认出了它。"],()=>{S.knowledge++;S.quest[1]=Math.min(100,S.quest[1]+4);gain(12)})}
function lesson(){let x=V9.beginner[Math.floor(Math.random()*V9.beginner.length)];dialogue("TRAINING",[`${x.term} = ${x.cn}`,x.baby,`📍 ${x.where}`,`工作时：${x.check}`],()=>{S.knowledge++;S.quest[0]=Math.min(100,S.quest[0]+2);S.quest[1]=Math.min(100,S.quest[1]+3);time(30);gain(10)})}
function business(){dialogue("KHALID",["M4 2024. carbon front lip. best price?","Serena: got u. G82 M4 Competition? send me one front pic too — I wanna check the exact fitment.","Khalid: why pic? 2024 is enough no?","Serena: year helps, but bumper/version can still matter. takes me 2 mins now, saves both of us a headache later.","Khalid: fair. dry carbon glossy. [PHOTO]","Serena: perfect. checking actual product + ready stock now. where in Dubai for shipping?","Khalid: Al Quoz."],()=>{S.biz++;S.trust.khalid+=6;S.quest[2]=Math.min(100,S.quest[2]+10);time(25);gain(15)})}
function openPhone(){let p=document.createElement("div");p.className="phone";p.id="ph";p.innerHTML=`<button class="close" onclick="document.querySelector('#ph').remove()">×</button><h2>PHONE</h2>${G.characters.map(c=>`<div class="bubble" onclick="phoneChat('${c.id}')"><b>${c.name}</b><br>${c.msgs[0]}</div>`).join("")}<hr><button onclick="openPanel('chars')">♥ Relationships</button> <button onclick="openPanel('inv')">🎒 Bag</button>`;document.body.appendChild(p)}
function phoneChat(id){document.querySelector("#ph")?.remove();let c=G.characters.find(x=>x.id===id);let lines=id==="ayo"?["Ayo: how's Guangzhou treating u","Serena: alive. learning cars against my will","Ayo: 😂 show me what ur working on","Serena: when i can finally tell the parts apart"] : id==="hk"?["HK Boy: 仲未瞓？","Serena: 仲学紧车 😭","HK Boy: 你真系去做改装啊","Serena: 唔系我改 我卖啊大佬"] : c.msgs.map(x=>`${c.name}: ${x}`);dialogue(c.name,lines,()=>{S.trust[id]=Math.min(100,(S.trust[id]||0)+2);gain(4)})}
function notify(id,msg){let c=G.characters.find(x=>x.id===id.toLowerCase())||G.characters.find(x=>x.name===id);toast(`💬 ${id}: ${msg}`)}
function incoming(name){if(document.querySelector(".incoming"))return;let d=document.createElement("div");d.className="incoming";d.innerHTML=`<div>📞 INCOMING CALL</div><div class="who">${name}</div><button class="callbtn" onclick="this.parentNode.remove()">❌</button><button class="callbtn" onclick="answerCall('${name}');this.parentNode.remove()">📞</button>`;document.body.appendChild(d)}
function answerCall(name){if(name==="Khalid")dialogue("KHALID · CALL",["Hey Serena, you got the M4 lip?","Serena: I'm checking the exact part now. dry carbon glossy, G82 Competition, right?","Yes. I need it fast.","Serena: I won't promise dispatch until I confirm ready stock. gimme 10 mins and I'll text u the actual status.","Good. Send shipping too."],()=>{S.trust.khalid+=5;gain(8)})}
function openPanel(type){document.querySelector(".panel")?.remove();let p=document.createElement("div");p.className="panel";let body="";if(type==="status")body=`<h2>SERENA · LV.${S.lv}</h2><p>EXP ${S.xp}/100 · 体力 ${S.energy} · 心情 ${S.mood} · ¥${S.money}</p><h3>任务</h3>${G.quests.map((q,i)=>`<p><b>${q.name}</b> ${S.quest[i]}%</p><div class="bar"><i style="width:${S.quest[i]}%"></i></div>`).join("")}<button onclick="openPanel('chars')">♥ 人物</button> <button onclick="openPanel('inv')">🎒 道具</button>`;if(type==="chars")body=`<h2>RELATIONSHIPS</h2><div class="grid">${G.characters.map(c=>`<div class="card"><h3>${c.portrait} ${c.name}</h3><div class="heart">${"♥".repeat(S.rels[c.id]||0)}${"♡".repeat(5-(S.rels[c.id]||0))}</div><p>信任 ${S.trust[c.id]||0}/100</p><small>${c.route}</small></div>`).join("")}</div>`;if(type==="inv")body=`<h2>🎒 BAG</h2><div class="grid">${G.items.map(x=>`<div class="card"><h3>${x.icon} ${x.name}</h3><p>${x.desc}</p></div>`).join("")}</div>`;p.innerHTML=`<button class="close" onclick="this.parentNode.remove()">×</button>${body}`;document.body.appendChild(p)}
function toast(t){let d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}boot();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
