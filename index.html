<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>CARBON//DESIRE 19</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050406;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}button{font:inherit;color:#fff}.game{position:fixed;inset:0;background:#09070a}.top{position:absolute;z-index:20;top:0;left:0;right:0;height:62px;background:#09070add;display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid #ffffff2c}.logo{font:700 19px Georgia;color:#ffafc8;margin-right:auto}.logo b{color:#ff477e}.badge{padding:7px 10px;background:#161117;border:1px solid #ffffff32;border-radius:8px;font-size:12px}.scene{position:absolute;inset:62px 0 0;background:center/cover no-repeat;overflow:hidden}.shade{position:absolute;inset:0;background:linear-gradient(#0001,#0006)}.hot{position:absolute;z-index:5;background:#0d0a0dcc;border:1px solid #ffb0c8;border-radius:12px;padding:10px 14px;box-shadow:0 5px 20px #0009;backdrop-filter:blur(6px)}.hot:active{transform:scale(.97)}.label{font-weight:800}.sub{font-size:10px;color:#ddd;margin-top:2px}.dock{position:absolute;z-index:8;left:1%;right:1%;bottom:1.5%;height:22%;display:flex;gap:7px}.loc{flex:1;border:1px solid #ffffff55;border-radius:11px;background:center/cover;position:relative;overflow:hidden;min-width:0}.loc:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#000e)}.loc span{position:absolute;z-index:2;left:8px;bottom:7px;font-weight:800;font-size:12px}.phone{position:absolute;z-index:40;right:2%;top:4%;bottom:4%;width:min(370px,48vw);background:#f5f4f3;color:#171317;border:8px solid #0b090b;border-radius:29px;padding:15px;box-shadow:0 20px 60px #000;overflow:auto}.phone h3{margin:3px 0 12px}.msg{padding:11px 6px;border-bottom:1px solid #ddd}.msg b{display:block}.msg small{color:#666}.close{position:sticky;float:right;top:0;border:0;border-radius:50%;background:#161116;padding:8px 11px}.dialog{position:absolute;z-index:50;left:4%;right:4%;bottom:3%;min-height:25%;background:#0b080beF;border:1px solid #ff91b2;border-radius:12px;padding:16px 18px;box-shadow:0 15px 50px #000}.who{font:700 21px Georgia;color:#ff9dbb}.line{font-size:18px;line-height:1.55;margin:8px 0}.next{float:right;background:#ff8caf;color:#1b1015;border:0;padding:9px 15px;border-radius:8px;font-weight:900}.mapcard{position:absolute;z-index:30;inset:4%;background:#0b090bed;border:1px solid #ff9fbd;border-radius:15px;padding:13px;overflow:auto}.mapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.m{height:145px;background:center/cover;border:1px solid #ffffff55;border-radius:12px;position:relative}.m span{position:absolute;left:0;right:0;bottom:0;padding:30px 9px 9px;background:linear-gradient(transparent,#000e);font-weight:900}.tiny{font-size:11px;color:#ddd}@media(max-width:900px){.logo{font-size:15px}.badge{font-size:10px;padding:6px}.dock{height:19%}.loc span{font-size:10px}.line{font-size:16px}}
</style></head><body><div class="game"><div class="top"><div class="logo"><b>CARBON</b>//DESIRE · <b>19</b></div><div class="badge" id="clock">DAY 1 · 09:17</div><div class="badge">广州</div><div class="badge">¥ 8,560</div><button class="badge" onclick="phone()">PHONE ●</button></div><div id="scene" class="scene"></div></div><script>
let minute=557,loc='home'; const scenes={home:'v19_home_game.png',company:'v17_company.jpg',garage:'v16_006.jpg',warehouse:'v17_warehouse.jpg',expo:'v16_exhibition.jpg',gym:'scene_gym.jpg',mall:'v17_mall_thumb.jpg',bar:'v17_bar_thumb.jpg'};
function tick(n=0){minute+=n;document.getElementById('clock').textContent=`DAY 1 · ${String(Math.floor(minute/60)).padStart(2,'0')}:${String(minute%60).padStart(2,'0')}`}
function render(){let bg=scenes[loc]||'v17_home.jpg';let extras=loc==='home'?`<button class="hot" style="left:9%;top:58%" onclick="say('SERENA',['再睡十分钟的话，九点培训就真的要迟到了。'])"><div class="label">床</div><div class="sub">REST</div></button><button class="hot" style="left:43%;top:66%" onclick="phone()"><div class="label">手机 ●</div><div class="sub">3 unread</div></button><button class="hot" style="left:62%;top:52%" onclick="say('电脑',['CSSCAR 产品资料','Alibaba 店铺','客户询盘','订单 K-001'],()=>go('company'))"><div class="label">电脑</div><div class="sub">WORK</div></button><button class="hot" style="right:8%;top:36%" onclick="map()"><div class="label">出门</div><div class="sub">去广州</div></button>`:loc==='company'?`<button class="hot" style="left:44%;top:45%" onclick="lesson()"><div class="label">G82 实车课</div><div class="sub">点车认部位</div></button><button class="hot" style="right:7%;top:20%" onclick="map()"><div class="label">离开公司</div></button>`:loc==='garage'?`<button class="hot" style="left:45%;top:45%" onclick="say('REN',[\"u actually came.\",'别看目录。先告诉我 rear diffuser 在哪。','你指向车尾最下面、排气附近。',\"Ren: good. now u can name it.\"],()=>tick(25))"><div class="label">Ren · 006</div><div class="sub">看实车</div></button>`:`<button class="hot" style="right:7%;top:15%" onclick="map()"><div class="label">地图</div></button>`;document.getElementById('scene').style.backgroundImage=`linear-gradient(#0001,#0006),url(${bg})`;document.getElementById('scene').innerHTML=`<div class="shade"></div>${extras}<div class="dock"><button class="loc" style="background-image:url(v17_home.jpg)" onclick="go('home')"><span>公寓</span></button><button class="loc" style="background-image:url(v17_company_thumb.jpg)" onclick="go('company')"><span>公司</span></button><button class="loc" style="background-image:url(v17_006_thumb.jpg)" onclick="go('garage')"><span>006</span></button><button class="loc" style="background-image:url(v17_warehouse_thumb.jpg)" onclick="go('warehouse')"><span>仓库</span></button><button class="loc" style="background-image:url(v17_expo_thumb.jpg)" onclick="go('expo')"><span>展会</span></button></div>`}
function go(x){loc=x;tick(20);render()}
function phone(){let d=document.createElement('div');d.className='phone';d.innerHTML=`<button class="close" onclick="this.parentNode.remove()">×</button><h3>WhatsApp</h3><div class="msg" onclick="this.parentNode.remove();say('KHALID',['hi Serena','need front lip for G82','2024. dry carbon. ready stock?','这不是考试题。你上午马上就要在公司见到这台车。'])"><b>Khalid · Client</b><small>need front lip for G82</small></div><div class="msg"><b>Ren · 006</b><small>u free today?</small></div><div class="msg"><b>Ayo</b><small>miss u...</small></div><div class="msg"><b>毛总</b><small>9:00 培训，记得带笔记本</small></div>`;document.querySelector('.game').appendChild(d)}
function say(w,ls,done){let i=0,d=document.createElement('div');d.className='dialog';document.getElementById('scene').appendChild(d);function draw(){d.innerHTML=`<div class="who">${w}</div><div class="line">${ls[i]}</div><button class="next">▼</button>`;d.querySelector('.next').onclick=()=>{if(++i>=ls.length){d.remove();done&&done()}else draw()}}draw()}
function lesson(){say('毛总',['今天不背词。','BMW G82 M4 · 2024 · Dry Carbon Front Lip','你先别告诉我中文。你直接指出它装在哪里。'],()=>{let d=document.createElement('button');d.className='hot';d.style='left:39%;top:63%;width:24%;height:15%;background:#ff9dbb44';d.innerHTML='<div class="label">点这里：车头最下沿</div>';d.onclick=()=>{d.remove();say('SYSTEM',['FRONT LIP · 前唇','不是“记住答案”。是先认位置，再认名字。','Khalid 刚好正在问同一个部位。'],()=>phone())};document.getElementById('scene').appendChild(d)})}
function map(){let d=document.createElement('div');d.className='mapcard';d.innerHTML=`<button class="close" onclick="this.parentNode.remove()">×</button><h2>广州 · 09:xx</h2><div class="mapgrid">${[['company','v17_company_thumb.jpg','公司'],['garage','v17_006_thumb.jpg','006 改装店'],['warehouse','v17_warehouse_thumb.jpg','仓库'],['expo','v17_expo_thumb.jpg','展会'],['mall','v17_mall_thumb.jpg','商场'],['gym','v17_gym_thumb.jpg','健身房'],['bar','v17_bar_thumb.jpg','酒吧'],['home','v17_home.jpg','公寓']].map(x=>`<button class="m" style="background-image:url(${x[1]})" onclick="this.closest('.mapcard').remove();go('${x[0]}')"><span>${x[2]}<br><small>20 min</small></span></button>`).join('')}</div>`;document.querySelector('.game').appendChild(d)}
render();setTimeout(phone,700);
</script></body></html>
