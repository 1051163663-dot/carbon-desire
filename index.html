<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>CARBON//DESIRE V10</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080708;color:#f9eff2;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}button{font:inherit}.top{height:68px;background:#151013;display:flex;align-items:center;padding:8px 12px;gap:8px;border-bottom:1px solid #805463}.logo{font:700 21px Georgia;color:#f2b1c5;margin-right:auto}.tag{background:#e998b1;color:#1d1116;padding:7px 9px;font-weight:900}.body{position:absolute;top:68px;bottom:0;left:0;right:0;display:grid;grid-template-columns:145px 1fr 225px}.nav,.right{background:#151013;padding:8px;overflow:auto}.nav button{display:block;width:100%;text-align:left;color:white;background:transparent;border:0;padding:10px 6px}.main{overflow:auto;-webkit-overflow-scrolling:touch;padding:11px;background:#21191d}.right h3{margin:8px 0 4px}.bar{height:9px;background:#49373e;border-radius:5px;overflow:hidden;margin:4px 0 9px}.bar i{display:block;height:100%;background:#e998b1}.xp i{background:#9bc9e8}.hero{min-height:58vh;background:linear-gradient(90deg,#000e,#0003),url(build07_ui.png) center/cover;border:1px solid #946474;padding:23px;display:flex;flex-direction:column;justify-content:flex-end}.hero h1{font:700 clamp(38px,6vw,72px) Georgia;color:#f2b1c5;margin:0}.hero p{font-size:18px;line-height:1.7;background:#110d10e8;padding:11px;max-width:760px}.pink{background:#e998b1;color:#1d1116;border:0;padding:11px 13px;font-weight:900;margin:3px}.sheet{background:#f7f0ed;color:#2b2024;padding:15px;border:1px solid #b58493;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.card{background:white;color:#2b2024;border:1px solid #c69ba7;padding:12px;min-height:135px;text-align:left}.card h3{margin:0 0 6px;color:#9e4d69;font-size:20px}.heart{color:#d54f7c;font-size:20px}.small{font-size:12px;color:#cbb9c0}.quest{background:#fff;padding:11px;border:1px solid #c69ba7;margin:7px 0}.quest .bar{background:#eadde1}.charHead{display:flex;gap:15px;align-items:center}.avatar{width:82px;height:82px;border-radius:50%;background:#21191d;color:#fff;display:grid;place-items:center;font-size:39px}.bubble{background:#fff;color:#241b1f;padding:10px 12px;border-radius:14px;margin:7px 0;max-width:80%;font-size:17px;line-height:1.55}.me{margin-left:auto;background:#e8a6ba}.chat{background:#171114;padding:16px;border:2px solid #d88ba3}.phone{position:fixed;z-index:80;right:12px;top:75px;bottom:12px;width:min(420px,65vw);display:none;background:#f7f0ed;color:#241b1f;border:4px solid #171114;border-radius:24px;padding:15px;overflow:auto}.close{float:right;background:#171114;color:white;border:0;padding:8px 11px}.notif{display:inline-grid;place-items:center;background:#d84f78;color:white;border-radius:10px;min-width:20px;height:20px}.diagram{white-space:pre-wrap;background:#171114;color:#fff;padding:15px;font:700 17px/1.5 ui-monospace,monospace}.choice{display:block;width:100%;text-align:left;padding:11px;margin:5px 0;border:1px solid #d99aab;background:#fff}.lock{opacity:.55}@media(max-width:950px){.body{grid-template-columns:112px 1fr}.right{display:none}.nav{font-size:10px}}
</style></head><body><header class="top"><div class="logo">CARBON//DESIRE</div><div class="tag">V10 · GAME SYSTEM</div><div id="time" class="tag"></div><button class="pink" onclick="phone()">📱 <span class="notif">5</span></button></header><div class="body"><nav class="nav"><button onclick="home()">⌂ 游戏</button><button onclick="quests()">▰ 进度</button><button onclick="characters()">♥ 人物</button><button onclick="inventory()">🎒 道具</button><button onclick="map()">📍 地图</button><button onclick="messages()">💬 短信</button><button onclick="beginner()">🍼 汽车白痴课</button><button onclick="business()">💼 业务</button><button onclick="save()">💾 保存</button></nav><main id="main" class="main"></main><aside class="right"><h3>SERENA · LV.<span id="lv"></span></h3><div class="small" id="xptext"></div><div class="bar xp"><i id="xpbar"></i></div><div id="stats"></div><h3>MAIN QUEST</h3><div id="mq" class="small"></div></aside></div><div class="phone" id="phone"><button class="close" onclick="phone()">×</button><h2>PHONE</h2><div id="phonebody"></div></div>
<script>
let G=null,V9=null;let S=JSON.parse(localStorage.getItem("cd10")||"null")||{day:1,hour:9,lv:1,xp:0,energy:82,mood:64,money:8560,knowledge:1,biz:1,loc:"公司",rels:{ren:2,ayo:3,hk:1,meng:1,adrian:0,marco:0,khalid:0},trust:{ren:10,ayo:22,hk:8,meng:6,adrian:15,marco:28,khalid:20},quest:[18,20,12,8,5],logs:[]};const $=q=>document.querySelector(q);
async function boot(){G=await fetch("./v10_game.json?v=10").then(r=>r.json());V9=await fetch("./v9_beginner.json?v=10").then(r=>r.json()).catch(()=>({beginner:[]}));render();home()}function save(){localStorage.setItem("cd10",JSON.stringify(S));render()}function gain(x){S.xp+=x;while(S.xp>=100){S.xp-=100;S.lv++;S.energy=Math.min(100,S.energy+15);pop(`LEVEL UP → ${S.lv}`)}save()}function render(){$("#time").textContent=`DAY ${S.day} · ${String(S.hour).padStart(2,"0")}:00`;$("#lv").textContent=S.lv;$("#xptext").textContent=`EXP ${S.xp}/100`;$("#xpbar").style.width=S.xp+"%";$("#stats").innerHTML=`体力 ${S.energy}/100<div class="bar"><i style="width:${S.energy}%"></i></div>心情 ${S.mood}/100<div class="bar"><i style="width:${S.mood}%"></i></div>汽车知识 Lv.${S.knowledge}<div class="bar"><i style="width:${Math.min(100,S.knowledge*8)}%"></i></div>业务能力 Lv.${S.biz}<div class="bar"><i style="width:${Math.min(100,S.biz*8)}%"></i></div>现金 ¥${S.money}`;$("#mq").innerHTML=`广州岗前训练 ${S.quest[0]}%<div class="bar"><i style="width:${S.quest[0]}%"></i></div>迪拜准备 ${S.quest[4]}%<div class="bar"><i style="width:${S.quest[4]}%"></i></div>`}function home(){$("#main").innerHTML=`<section class="hero"><h1>DAY ${S.day} · ${S.loc}</h1><p>这次终于按“游戏”来：等级、经验、任务进度、人物好感、信任、道具、地图、短信和业务线都进同一个存档。你今天可以学车，也可以找人、回消息、跑 006、做客户，或者什么正事都不干。</p><div><button class="pink" onclick="map()">自由行动</button><button class="pink" onclick="characters()">看看谁在</button><button class="pink" onclick="quests()">任务进度</button></div></section>`}function quests(){$("#main").innerHTML=`<section class="sheet"><h2>▰ QUEST / 进度</h2>${G.quests.map((q,i)=>`<div class="quest"><b>${q.name}</b><span style="float:right">${S.quest[i]}%</span><div class="bar"><i style="width:${S.quest[i]}%"></i></div><small>${q.desc}</small></div>`).join("")}</section>`}function characters(){$("#main").innerHTML=`<section class="sheet"><h2>♥ CHARACTERS</h2><p>好感 ≠ 信任。暧昧高不代表对方会把业务交给你；客户信任高也不等于恋爱。</p><div class="grid">${G.characters.map(c=>`<button class="card" onclick="character('${c.id}')"><h3>${c.portrait} ${c.name}</h3><b>${c.role}</b><p class="heart">${"♥".repeat(S.rels[c.id]||0)}${"♡".repeat(Math.max(0,5-(S.rels[c.id]||0)))}</p><small>信任 ${S.trust[c.id]||0}/100 · ${c.route}</small></button>`).join("")}</div></section>`}function character(id){let c=G.characters.find(x=>x.id===id);$("#main").innerHTML=`<section class="sheet"><div class="charHead"><div class="avatar">${c.portrait}</div><div><h2>${c.name} · ${c.age}</h2><b>${c.role}</b><div class="heart">${"♥".repeat(S.rels[id]||0)}${"♡".repeat(Math.max(0,5-(S.rels[id]||0)))}</div>信任 ${S.trust[id]||0}/100</div></div><p>${c.desc}</p><p><b>通常出现：</b>${c.loc}</p><div class="chat">${c.msgs.map((m,i)=>`<div class="bubble ${i%2?"me":""}">${i%2?"Serena: ":""+m}</div>`).join("")}</div><button class="pink" onclick="interact('${id}','talk')">聊一会</button><button class="pink" onclick="interact('${id}','message')">发消息</button>${id==="ren"?`<button class="pink" onclick="interact('${id}','garage')">去 006 找他</button>`:""}</section>`}function interact(id,type){let c=G.characters.find(x=>x.id===id);S.trust[id]=Math.min(100,(S.trust[id]||0)+(type==="message"?2:4));if(["ren","ayo","hk","meng","adrian"].includes(id)&&type!=="message")S.rels[id]=Math.min(5,(S.rels[id]||0)+1);S.energy=Math.max(0,S.energy-5);S.hour=(S.hour+1)%24;S.logs.unshift(`${c.name} · ${type}`);gain(8);character(id)}function inventory(){$("#main").innerHTML=`<section class="sheet"><h2>🎒 INVENTORY / 道具</h2><div class="grid">${G.items.map(x=>`<div class="card"><h3>${x.icon} ${x.name}</h3><b>${x.type} · ×${x.qty}</b><p>${x.desc}</p></div>`).join("")}</div></section>`}function map(){$("#main").innerHTML=`<section class="sheet"><h2>📍 GUANGZHOU MAP</h2><div class="grid">${[["🏢","公司","培训/客户/报价"],["🏁","006 改装店","实车/Ren/夜间事件"],["📦","仓库","验货/包装/库存"],["🎪","展会","Marco/客户开发"],["🏠","公寓","睡觉/3DS/手机"],["🏋️","健身房","恢复心情"],["🛍️","商场","吃饭/停车场认车"],["🍸","酒吧","夜间人物事件"]].map(x=>`<button class="card" onclick="travel('${x[1]}')"><h3>${x[0]} ${x[1]}</h3><p>${x[2]}</p></button>`).join("")}</div></section>`}function travel(l){S.loc=l;S.hour=(S.hour+1)%24;S.energy=Math.max(0,S.energy-3);S.logs.unshift(`到达 ${l}`);gain(3);if(l==="006 改装店"&&S.hour>=19){S.rels.ren=Math.min(5,S.rels.ren+1);pop("Ren 在店里。今晚有一台 G63，后杠还没装回去。")}home()}function messages(){$("#main").innerHTML=`<section class="sheet"><h2>💬 MESSAGES</h2><div class="grid">${G.characters.map(c=>`<button class="card" onclick="character('${c.id}')"><h3>${c.portrait} ${c.name}</h3><p>${c.msgs[0]}</p><small>点击进入对话 / 关系页</small></button>`).join("")}</div></section>`}function phone(){$("#phone").style.display=$("#phone").style.display==="block"?"none":"block";$("#phonebody").innerHTML=G?G.characters.slice(0,6).map(c=>`<div class="bubble" onclick="phone();character('${c.id}')"><b>${c.name}</b><br>${c.msgs[0]}</div>`).join(""):""}function beginner(){let arr=V9.beginner||[];$("#main").innerHTML=`<section class="sheet"><h2>🍼 汽车白痴课</h2><p>不要求你懂车。先记“在哪里”，再记名字。</p><div class="grid">${arr.map((x,i)=>`<button class="card" onclick="lesson(${i})"><h3>${x.term}</h3><b>${x.cn}</b><p>${x.baby.slice(0,70)}...</p></button>`).join("")}</div></section>`}function lesson(i){let x=V9.beginner[i];$("#main").innerHTML=`<section class="sheet"><h2>${x.term}｜${x.cn}</h2><p style="font-size:19px;line-height:1.7">${x.baby}</p><div class="diagram">${x.emoji}</div><p><b>📍位置：</b>${x.where}</p><p><b>工作时：</b>${x.check}</p><button class="pink" onclick="learn()">我看懂了 +EXP</button></section>`}function learn(){S.knowledge++;S.quest[1]=Math.min(100,S.quest[1]+4);S.quest[0]=Math.min(100,S.quest[0]+2);gain(12);beginner()}function business(){$("#main").innerHTML=`<section class="chat"><h2>Khalid · 真实成交链</h2><div class="bubble">Khalid: M4 2024. carbon front lip. best price?</div><div class="bubble me">Serena: got u. G82 M4 Competition? send me one front pic too — I wanna make sure I quote the exact fitment.</div><div class="bubble">Khalid: why pic? 2024 is enough no?</div><div class="bubble me">Serena: year helps, but bumper/version can still matter. takes me 2 mins to check now, saves both of us a headache later 😭 dry carbon glossy?</div><div class="bubble">Khalid: yes. another supplier says 350.</div><div class="bubble me">Serena: send me their pic/spec if u have it. I wanna compare same material + same pieces before I tell u whether I can beat it.</div><div class="bubble">Khalid: [PHOTO] they say vacuum carbon.</div><div class="bubble me">Serena: checking actual product + stock now. where in Dubai for shipping?</div><div class="bubble">Khalid: Al Quoz.</div><div class="bubble me">Serena: perfect. I'll separate product price and shipping so u can see exactly what ur paying for.</div><button class="pink" onclick="deal()">推进这一单</button></section>`}function deal(){S.biz++;S.trust.khalid=Math.min(100,S.trust.khalid+8);S.quest[2]=Math.min(100,S.quest[2]+12);S.quest[0]=Math.min(100,S.quest[0]+3);gain(15);pop("Khalid 线推进：需求已比之前更完整，但还没假装成交。下一步应查实际 SKU / 库存 / 公司报价。")}function pop(t){setTimeout(()=>alert(t),50)}boot();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
