<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>CARBON//DESIRE V8</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090709;color:#f8eef1;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}button{font:inherit}.app{position:fixed;inset:0;background:#110d0f}.top{height:62px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:#171114;border-bottom:1px solid #7b5360}.logo{font:700 20px Georgia;color:#f3b2c6;margin-right:auto}.pill{border:1px solid #76515c;padding:6px 8px;font-size:11px}.body{position:absolute;top:62px;bottom:0;left:0;right:0;display:grid;grid-template-columns:155px 1fr 230px}.nav,.side{background:#171114;overflow:auto;padding:8px}.nav button{display:block;width:100%;text-align:left;padding:10px 7px;margin:2px 0;background:transparent;border:0;color:#fff}.main{overflow:auto;-webkit-overflow-scrolling:touch;background:#21191d;padding:11px}.hero{min-height:63vh;background:linear-gradient(90deg,#000d,#0002),url(build07_ui.png) center/cover;border:1px solid #8d6270;padding:24px;display:flex;flex-direction:column;justify-content:flex-end}.hero h1{font:700 clamp(38px,6vw,74px) Georgia;color:#f1b0c4;margin:0}.hero p{max-width:760px;background:#120d10e8;padding:12px;font-size:17px;line-height:1.65}.pink{background:#e996af;color:#1b1115;border:0;padding:11px 14px;font-weight:900;margin:3px}.sheet{background:#f6efec;color:#2b2024;border:1px solid #b0808e;padding:15px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.card{background:#fff;color:#2b2024;border:1px solid #c39ba6;padding:12px;min-height:120px;text-align:left}.card h3{margin:0 0 7px;color:#9e4d69;font-size:20px}.card p{line-height:1.55}.chatbox{max-width:900px;margin:auto;background:#eee6e3;color:#21191d;padding:15px;border-radius:18px}.bubble{max-width:82%;padding:11px 13px;border-radius:16px;margin:8px 0;line-height:1.55;font-size:17px}.them{background:#fff}.me{background:#f1b1c5;margin-left:auto}.sys{background:#ded5d7;margin:10px auto;text-align:center;font-size:13px}.call{background:#101014;color:#fff;border:2px solid #e996af;padding:18px;max-width:900px;margin:auto}.call .speaker{font-weight:900;color:#f3b2c6;font-size:20px}.term{border-bottom:2px dotted #a94e6c;cursor:pointer}.explain{background:#f1dbe2;padding:10px;border-left:5px solid #b85f7c;margin:8px 0;line-height:1.65}.visual{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.big{width:100%;max-height:65vh;object-fit:contain;background:#0d0a0c}.termTitle{font-size:31px;font-weight:900}.cn{font-size:24px;color:#a44f6b}.story{max-width:930px;margin:auto;background:#171114;border:2px solid #d98da5;padding:18px}.story .who{font:700 25px Georgia;color:#efabc0}.story p{font-size:19px;line-height:1.75}.choice{display:block;width:100%;text-align:left;background:#f8edf0;border:1px solid #d98da5;padding:11px;margin:5px 0}.bar{height:7px;background:#4b3940;margin:4px 0 10px}.bar i{display:block;height:100%;background:#e996af}.small{font-size:11px;color:#cdbbc1}.phone,.modal{position:fixed;z-index:80;display:none;overflow:auto;background:#f6efec;color:#241b1f;border:4px solid #171114;padding:18px}.phone{right:15px;top:70px;bottom:15px;width:min(440px,62vw);border-radius:24px}.modal{inset:4%}.close{float:right;position:sticky;top:0;background:#171114;color:#fff;border:0;padding:9px 13px}.gloss{font-size:18px}.gloss b{color:#9e4d69;font-size:21px}.ascii{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;background:#161216;color:#f7d7e1;padding:15px;font-size:16px;line-height:1.25;overflow:auto}.badge{display:inline-block;padding:4px 7px;background:#f0d5de;margin:2px;font-size:12px}@media(max-width:930px){.body{grid-template-columns:115px 1fr}.side{display:none}.nav{font-size:10px}.visual{grid-template-columns:1fr}.bubble{font-size:15px}.logo{font-size:13px}}
</style></head><body><div class="app"><header class="top"><div class="logo">CARBON//DESIRE · BUILD 0.8</div><div class="pill" style="border-color:#e996af;color:#f3b2c6">V8 MEGA</div><div class="pill" id="clock"></div><button class="pink" onclick="phone()">📱 PHONE</button></header><div class="body"><nav class="nav"><button onclick="home()">⌂ 首页</button><button onclick="story()">♥ GAL剧情</button><button onclick="business()">💬 真实业务对话</button><button onclick="calls()">☎ 电话</button><button onclick="parts()">🚗 配件图解</button><button onclick="glossary()">📖 白话词典</button><button onclick="asciiLab()">⌨ 符号简图</button><button onclick="oldGame()">☀ 自由行动</button><button onclick="save()">💾 保存</button><button onclick="reset()">↻ 新游戏</button></nav><main class="main" id="main"></main><aside class="side"><h3>V8 学习原则</h3><div class="small">① 先看车上位置<br>② 再记英文<br>③ 专业词点开就解释<br>④ 对话必须来回推进<br>⑤ 报价前锁规格<br>⑥ 电话/短信都练</div><h3>进度</h3><div id="status"></div></aside></div><div class="phone" id="phone"><button class="close" onclick="phone()">×</button><h2>📱 PHONE</h2><button class="pink" onclick="business();phone()">WhatsApp 客户</button><button class="pink" onclick="calls();phone()">Incoming Calls</button><div class="bubble them"><b>Ren</b><br>u coming tonight or not</div><div class="bubble them"><b>Khalid</b><br>send shipping too pls</div></div><div class="modal" id="modal"><button class="close" onclick="closeM()">×</button><div id="mb"></div></div></div><script>
let D,S=JSON.parse(localStorage.getItem('cd08')||'null')||{day:1,hour:9,story:0,scene:0,turn:0,learned:[],logs:[]};const $=q=>document.querySelector(q);async function boot(){D=await fetch('./v8_data.json?v=8').then(r=>r.json());render();home()}function save(){localStorage.setItem('cd08',JSON.stringify(S));render()}function render(){$('#clock').textContent=`DAY ${S.day} · ${String(S.hour).padStart(2,'0')}:00`;$('#status').innerHTML=`剧情 ${S.story}/${D?D.story8.length:0}<div class="bar"><i style="width:${D?Math.min(100,S.story/D.story8.length*100):0}%"></i></div>术语 ${S.learned.length}/${D?D.glossary.length:0}<div class="bar"><i style="width:${D?Math.min(100,S.learned.length/D.glossary.length*100):0}%"></i></div>`}function home(){$('#main').innerHTML=`<section class="hero"><h1>V8 · TALK LIKE REAL BUSINESS</h1><p>这版重点不是继续堆菜单，而是把你最难受的地方拆掉：客户不会一句话就成交；WhatsApp 会来回十几轮，电话会追问，供应商会含糊，客户会压价。所有难词都能点开看中文白话解释，配件页同时有大图 + 独立简笔图 + 符号位置图。</p><div><button class="pink" onclick="business()">先练真实客户</button><button class="pink" onclick="parts()">先看配件位置</button><button class="pink" onclick="story()">继续 GAL</button></div></section>`}function story(){let x=D.story8[S.story%D.story8.length];$('#main').innerHTML=`<div class="story"><div class="small">${x[0]}</div><div class="who">${x[1]}</div><p>${linkTerms(x[2])}</p><button class="choice" onclick="nextStory()">继续</button><button class="choice" onclick="glossary()">有词看不懂 → 打开白话词典</button></div>`}function nextStory(){S.story++;S.hour++;if(S.hour>=24){S.hour=8;S.day++}save();story()}function business(){$('#main').innerHTML=`<section class="sheet"><h2>真实业务对话训练</h2><p>不是“选正确答案 → 成交”。进去以后看完整来回；每一轮下面都有“这句话为什么这么说”。</p><div class="grid">${D.scenarios.map((s,i)=>`<button class="card" onclick="openScenario(${i})"><h3>${s.channel==='Phone Call'?'☎':'💬'} ${s.name}</h3><p>${s.opening}</p><p><b>${s.turns.length} 轮真实对话</b></p></button>`).join('')}</div></section>`}function openScenario(i){S.scene=i;S.turn=0;save();renderScenario()}function renderScenario(){let s=D.scenarios[S.scene],turns=s.turns.slice(0,S.turn+1);$('#main').innerHTML=`<div class="chatbox"><h2>${s.channel==='Phone Call'?'☎':'💬'} ${s.name}</h2><div class="small">${s.opening}</div>${turns.map((t,j)=>`<div class="bubble ${t[0]==='Serena'?'me':'them'}"><b>${t[0]}</b><br>${linkTerms(t[1])}</div>${j===S.turn?coach(t[0],t[1]):''}`).join('')}<button class="pink" onclick="nextTurn()">${S.turn<s.turns.length-1?'看对方下一句 →':'对话复盘'}</button><button class="pink" onclick="business()">换客户</button></div>`}function nextTurn(){let s=D.scenarios[S.scene];if(S.turn<s.turns.length-1){S.turn++;save();renderScenario()}else reviewScenario()}function coach(who,text){if(who!=='Serena')return `<div class="explain">💡 <b>现在别急着回：</b>先分清客户给了什么事实、还缺什么。真实业务不是每句话都推销。</div>`;let why=text.includes('photo')||text.includes('pic')?'你在用图片把模糊需求变成可验证信息。':text.includes('price')?'没有直接卷最低价，而是先保证比较的是同规格。':text.includes('shipping')||text.includes('freight')?'产品价和落地成本分开；大件物流要看包装尺寸。':'这句话的目标是让下一轮信息更具体，而不是一次把客户说服。';return `<div class="explain">🧠 <b>为什么这样回：</b>${why}</div>`}function reviewScenario(){let s=D.scenarios[S.scene];$('#main').innerHTML=`<section class="sheet"><h2>${s.name} · 复盘</h2><p>这段对话一共 ${s.turns.length} 轮。注意：成交前反复确认并不代表“不会销售”，而是在减少错货、错价和售后。</p><p><b>你真正推进的是：</b>车型/版本 → 具体部件 → 材质/表面 → fitment 证据 → 库存/交期 → 包装/物流 → 报价。</p><button class="pink" onclick="openScenario(${S.scene})">重新看一遍</button></section>`}function calls(){let i=D.scenarios.findIndex(x=>x.channel==='Phone Call');if(i<0)return;S.scene=i;S.turn=0;save();let s=D.scenarios[i];$('#main').innerHTML=`<div class="call"><h2>☎ INCOMING CALL</h2><p>${s.name}</p><button class="pink" onclick="answerCall()">接听</button><button class="pink" onclick="popup('Missed Call','你没接。稍后可以 WhatsApp：hey Marco, saw ur call. free now if u wanna talk.')">挂掉 / 稍后回</button></div>`}function answerCall(){renderScenario()}function parts(){$('#main').innerHTML=`<section class="sheet"><h2>配件图解 · 先位置后英文</h2><div class="grid">${D.parts8.map((p,i)=>`<button class="card" onclick="part(${i})"><h3>${p[1]}</h3><div style="font-size:22px">${p[2]}</div><p>📍 ${p[3]}</p></button>`).join('')}</div></section>`}function part(i){let p=D.parts8[i];$('#main').innerHTML=`<section class="sheet visual"><div><img class="big" src="diagram_${p[0]}.svg"></div><div><div class="termTitle">${p[1]}</div><div class="cn">${p[2]}</div><h3>📍 ${p[3]}</h3><p>先别背定义。你只要先做到：看到整车时，能用手指出它在哪。</p><div class="ascii">${asciiFor(p[0],p[2])}</div><button class="pink" onclick="markPart('${p[0]}')">我能指出位置了</button><button class="pink" onclick="parts()">返回</button></div></section>`}function asciiFor(id,cn){let map={front_lip:'        _________\n   ____/         \\____\n  /   [  FRONT  ]     \\\n O_____________________O\n       ^^^^^^^^^^^\n          '+cn,front_bumper:'      ______________\n  ___/                \\___\n /   [  BUMPER AREA   ]   \\\nO__________________________O\n     <============>\n         '+cn,diffuser:' O______________________O\n  \\      REAR       /\n   \\_______________/\n      vvvvvvvvvvv\n       '+cn,side_skirt:' O----------------------O\n   ==================\n       '+cn,hood:'      _________\n  ___/  [ HOOD ] \\___\n /____________________\\\nO                      O\n       '+cn};return map[id]||'   🚗  ← 在整车上找：'+cn+'\n  [前]==========[后]\n       ↑ 位置示意'}function markPart(id){if(!S.learned.includes(id))S.learned.push(id);save();popup('记住方式','先记“它在车哪里”，第二次再记英文，第三次才加 fitment / material / version。别一口吞十个概念。')}function glossary(){$('#main').innerHTML=`<section class="sheet"><h2>白话专业词典</h2><p>你在对话里看到带虚线的词可以点。这里不写百科论文，只解释“工作时它到底是什么意思”。</p>${D.glossary.map((g,i)=>`<div class="gloss"><b>${g[0]}</b> · ${g[1]}<div class="explain">${g[2]}</div></div>`).join('')}</section>`}function linkTerms(t){let out=t;D.glossary.forEach((g,i)=>{let re=new RegExp('\\b'+g[0].replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\b','gi');out=out.replace(re,m=>`<span class="term" onclick="term(${i})">${m}</span>`)});return out}function term(i){let g=D.glossary[i];if(!S.learned.includes(g[0]))S.learned.push(g[0]);save();popup(g[0]+' · '+g[1],g[2])}function asciiLab(){$('#main').innerHTML=`<section class="sheet"><h2>符号简图实验室</h2><p>这些不是艺术图，是给你快速建立空间位置感的“汽车颜文字”。</p><div class="ascii">车头 FRONT\n\n       ┌──── HOOD 机盖 ────┐\n       │                    │\n   [FENDER]   GRILLE 中网   [FENDER]\n       │   FRONT BUMPER     │\n       └──── FRONT LIP ─────┘\n               ↓ 地面\n\n车侧 SIDE\n\n      _________ROOF________\n  ___/                     \\___\n O      DOOR / 车门          O\n  └──── SIDE SKIRT 侧裙 ────┘\n\n车尾 REAR\n\n       ┌─ SPOILER 尾翼 ─┐\n       │  REAR BUMPER   │\n       │   ○        ○   │ ← EXHAUST TIPS\n       └─ DIFFUSER 后扩 ┘</div><p>下一版还能继续给每个车型做“G82 专属位置图 / G63 专属位置图 / 992 专属位置图”。</p></section>`}function oldGame(){$('#main').innerHTML=`<section class="sheet"><h2>V7 原有系统仍保留在包里</h2><p>V8 重点重做对话、电话、术语解释和简图；原有图片素材、世界观和 PWA 资产没有删。后续会把自由行动系统继续并入这个 V8 主界面，而不是另起一个 Demo。</p><button class="pink" onclick="story()">去剧情</button><button class="pink" onclick="business()">去业务</button></section>`}function phone(){$('#phone').style.display=$('#phone').style.display==='block'?'none':'block'}function popup(t,b){$('#mb').innerHTML=`<h2>${t}</h2><p style="font-size:19px;line-height:1.75">${b}</p>`;$('#modal').style.display='block'}function closeM(){$('#modal').style.display='none'}function reset(){if(confirm('重置 V8 存档？')){localStorage.removeItem('cd08');location.reload()}}boot();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
