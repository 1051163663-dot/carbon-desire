const story=[{"title": "01｜第一天不是考试", "who": "SERENA", "text": "09:17。你比培训要求早到了十三分钟。办公室玻璃门后停着几台改装车，电脑桌面上是产品目录、Alibaba 和一堆你还看不懂的底盘代号。你本来准备装得很熟，毛总却把一张 G82 的车头照片推过来。", "choices": ["先看图，不装懂", "先问今天的任务"]}, {"title": "01｜第一天不是考试", "who": "毛总", "text": "“我不要你今天背五十个单词。先告诉我：客户发这张图说 need the lower carbon piece，你准备怎么确认他到底要什么？”", "choices": ["打开视觉图鉴", "问客户圈出位置"]}, {"title": "01｜第一天不是考试", "who": "REN", "text": "Ren 从车旁抬头，手套上还有一点碳纤灰。“lower piece could mean three different things if the photo is bad.” 他用鞋尖点了点车头最下沿。“front lip. start here.”", "choices": ["蹲下去看安装位置", "嘴硬：我知道"]}, {"title": "02｜一条不完整的 WhatsApp", "who": "KHALID", "text": "hi Serena. m4 2024. need carbon front. best price?", "choices": ["先确认具体部件和版本", "直接给最低价"]}, {"title": "02｜一条不完整的 WhatsApp", "who": "SERENA", "text": "你把消息拆成四格：车型 M4；年份 2024；carbon 但材质细节未锁；“front” 仍然模糊。你让客户在照片上圈位置，同时问 G82 Competition? 客户很快回了一张车头图。", "choices": ["比较 front lip 与 bumper", "查供应商"]}, {"title": "03｜仓库里比网页难认", "who": "SERENA", "text": "下午你第一次去仓库。网页上的碳纤件都有干净白底，现实里十几块黑色零件靠在纸箱边，背面朝外。你忽然发现：脱离整车以后，rear diffuser 比你想象中难认。", "choices": ["翻到正面找形状线索", "先看标签再验证实物"]}, {"title": "03｜仓库里比网页难认", "who": "REN", "text": "“Don't memorize the pretty side.” Ren 把 diffuser 翻过来，让你看安装孔和边缘。“customer sees the surface. installer sees this.”", "choices": ["拍下背面做笔记", "问 fitment 最常出什么问题"]}, {"title": "04｜午饭不是休息", "who": "SERENA", "text": "你们在楼下吃饭。Ren 问你为什么做汽车。你说以前卖整车，后来发现一辆车卖出去只是开始；有人买完第二天就想换轮毂、包围、内饰。Ren 笑：“so people buy a finished car and immediately decide it isn't finished.”", "choices": ["笑他总结得很准", "问他为什么做改装"]}, {"title": "04｜午饭不是休息", "who": "REN", "text": "“I like fixing ugly decisions.” 他停了一下，“and sometimes making expensive ones.” 你差点被水呛到。他把纸巾推过来，像什么都没发生。", "choices": ["说他很欠", "换话题聊 G63"]}, {"title": "05｜G63 进店", "who": "CLIENT", "text": "I want Brabus look. hood, grille, front lip, rear diffuser. dry carbon. make it aggressive.", "choices": ["拆成四个独立 SKU", "先问预算"]}, {"title": "05｜G63 进店", "who": "SERENA", "text": "这一次你没有把“Brabus look”当成一个产品名。你先确认 aftermarket Brabus-style，不把它说成 genuine；再逐项记录 hood、grille、front lip、rear diffuser，并拍实车前后照片。", "choices": ["检查传感器/现有改件", "去产品库配套"]}, {"title": "06｜Alibaba 深水区", "who": "SYSTEM", "text": "同一个搜索词出现 37 个几乎一样的标题：G82 M4 carbon front lip splitter spoiler performance style 2021 2022 2023 2024。标题很热闹，fitment 却不能靠关键词数量判断。", "choices": ["看 actual photos", "问供应商版本/安装案例"]}, {"title": "07｜展会十分钟", "who": "MARCO", "text": "I run a workshop. Porsche, Lamborghini, sometimes McLaren. I don't need the cheapest parts. I need parts that don't waste two hours of my mechanic's time.", "choices": ["问常做车型和安装痛点", "立刻发全目录"]}, {"title": "07｜展会十分钟", "who": "SERENA", "text": "你发现真正有用的问题不是“what's your budget”，而是“which models do you install most often?”、“what usually goes wrong with your current suppliers?”。十分钟后你只拿到一个 WhatsApp，却比旁边发出去二十本册子更有价值。", "choices": ["当晚做针对性 follow-up", "先记录客户事实/推测"]}, {"title": "08｜凌晨的 006", "who": "SERENA", "text": "23:52。你本来只来拿落下的充电器。006 还亮着灯，音乐很轻，升降机上是一台拆到一半的车。Ren 坐在地上整理螺丝，看到你只抬了下眉。", "choices": ["留下看一会", "拿完充电器就走"]}, {"title": "08｜凌晨的 006", "who": "REN", "text": "“come here.” 他没有解释。你走过去，他把手机灯打开照向车尾下方。“Tell me what changed.” 这次不是背单词。原厂后部和改装 diffuser 的轮廓真的不一样。", "choices": ["指出 diffuser 与排气区域", "让他别急，先看完整体"]}, {"title": "08｜凌晨的 006", "who": "REN", "text": "你答对以后他没有夸，只说：“better.” 隔了几秒又补一句，“you looked completely lost three days ago.” 你踢了一下他鞋尖。他没躲。", "choices": ["反击：你中文更差", "问他要不要喝东西"]}, {"title": "09｜第一次报价险些翻车", "who": "SERENA", "text": "供应商说“有货”。你正准备告诉客户 3 days，突然想起“有货”可能只是模具/半成品/可生产。你追问 ready stock photos and quantity。对方沉默了十分钟，回：need 7 days production。", "choices": ["更新客户真实 lead time", "记录供应商可靠性"]}, {"title": "10｜你开始看得见", "who": "SERENA", "text": "晚上回公寓，楼下经过一台车。以前你只会想“宝马”。现在你先看车身比例，再看双肾、灯组、前杠、后视镜和车尾。你没有立刻认出型号，但你的眼睛已经开始按汽车业务的方式工作。", "choices": ["回家玩 3DS", "把今天的错题做成图片笔记"]}, {"title": "视觉课｜Front Lip", "who": "SYSTEM", "text": "Front Lip｜前唇。位置：车头最下沿。它通常位于前保险杠下方，视觉上贴近地面。询盘里也可能见到 splitter / spoiler lip。不要仅凭名称判断兼容。 现在不要背定义：先打开独立大图，在整车上找到它，再想象客户只发局部照片时你会看哪些线索。", "choices": ["打开这件的大图", "继续剧情"]}, {"title let S=JSON.parse(localStorage.getItem("cd04")||"null")||{i:0,skill:0,ren:0,day:1,seen:[]};const $=q=>document.querySelector(q);function save(){localStorage.setItem("cd04",JSON.stringify(S));$("#stats").textContent=`DAY ${S.day} · 专业 ${S.skill} · Ren ${S.ren}`}function home(){$("#main").innerHTML=`<section class="hero"><h1>Chapter 1 · Guangzhou</h1><p>这次不是一张总图塞十个小字。剧情、汽车大图、独立部件课、客户询盘和人物事件分开进行。第一次遇到专业词，随时跳进大图看清它在车上的位置。</p><div><button class="pink" onclick="play()">继续剧情</button><button class="pink" onclick="partsLib()">部件大图</button><button class="pink" onclick="knowledge()">产品知识</button></div></section>`}function play(){let x=story[S.i%story.length];$("#main").innerHTML=`<div class="dialog"><div class="sceneTitle">${x.title}</div><div class="name">${x.who}</div><p>${x.text}</p><div class="choices">${x.choices.map((c,j)=>`<button onclick="choose(${j})">${c}</button>`).join("")}<button onclick="partsLib()">📷 看部件大图</button></div><div class="meter"><i style="width:${(S.i%story.length)/story.length*100}%"></i></div></div>`}function choose(j){let x=story[S.i%story.length];if(x.who==="REN"&&j===0)S.ren+=2;S.skill+=1;if(x.choices[j].includes("大图")){partsLib();save();return}S.i++;if(S.i%8===0)S.day++;save();play()}function partsLib(){$("#main").innerHTML=`<section class="sheet"><h2>改装部件｜一件一页，不挤小字</h2><p>点任何部件进入全屏大图。先建立“英文 ↔ 中文 ↔ 车身位置 ↔ 实物形状”的连接。</p><div class="grid">${parts.map((p,i)=>`<button class="card" onclick="part(${i})"><h3>${p[0]}</h3><div class="cn">${p[1]}</div><p>📍 ${p[2]}</p></button>`).join("")}</div></section>`}function part(i){let p=parts[i];$("#main").innerHTML=`<section class="sheet visual"><div><img class="bigpic" src="${p[4]}" onclick="zoom('${p[4]}')"></div><div><div class="term">${p[0]}</div><div class="cn">${p[1]}</div><div class="where">📍 ${p[2]}</div><p style="font-size:18px;line-height:1.75">${p[3]}</p><button class="pink" onclick="mark(${i})">我能在车上找到它了</button><button class="pink" onclick="partsLib()">返回全部部件</button></div></section>`}function mark(i){i
