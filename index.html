<script>
const scenes=[["序章｜广州", "SERENA", "国庆最后几天。培训群里已经堆了几十条产品链接。毛总说，别只背产品名，要从车型、配件、产品部件和改装逻辑去总结。你把电脑打开，决定第一件事不是背单词，而是把英文和实物接起来。"], ["DAY 1｜G82", "毛总", "今天只看 BMW M4 G82。看到 front lip，先知道它在车头最下沿；front bumper 是更大的前保险杠；grille 是中网；hood 是机盖。你要先建立位置感，再谈销售。"], ["DAY 1｜车头", "REN", "front lip. 前唇。看车头最下方。bumper is not the lip. 前杠是一整块更大的覆盖件。别把客户说的两个东西混在一起。"], ["DAY 1｜侧面", "SERENA", "切到侧面以后，side skirt 侧裙沿车门下缘延伸，fender 翼子板围绕车轮上方，mirror cap 是后视镜外壳。以前你只觉得都是黑色碳纤件，现在它们终于各自有了位置。"], ["DAY 1｜车尾", "REN", "rear diffuser 后扩散器在车尾下部，常常和排气区域相邻。rear bumper 后杠不是 diffuser。spoiler 或 wing 又是另一件。客户只说 rear kit 时，继续问。"], ["DAY 1｜询盘", "KHALID", "G82 m4 2024 need front lip dry carbon. stock?"], ["DAY 1｜处理", "SERENA", "你没有直接回 yes stock。你先拆信息：M4、2024、front lip、dry carbon。还需要确认 G82/具体版本、实车照片或 VIN、产品 fitment 和真实库存。"], ["DAY 2｜材料", "毛总", "客户说 carbon，不代表只有一种。dry carbon 干碳、forged carbon 锻造碳，以及市场里常见的 wet carbon 说法，都需要结合产品实际工艺和客户参考图确认。"], ["DAY 2｜样件", "REN", "ask what finish he wants. 亮面、哑面、纹路方向，客户可能比你想象得更在意。不要因为 forged 听起来贵就擅自升级。"], ["DAY 3｜Style", "毛总", "Mansory style、Brabus style、Vorsteiner style。style 就是 style。aftermarket 的仿风格件不能说成 genuine original。客户问是不是正品，要明确回答。"], ["DAY 3｜夜里", "REN", "you learn faster when u actually look at the car."], ["DAY 3｜夜里", "SERENA", "所以你第一天为什么只跟我说 front。"], ["DAY 3｜夜里", "REN", "because u were staring at it for five minutes."], ["DAY 4｜G63", "SERENA", "一台黑色 G-Class 开进店。客户要 Brabus-look hood、front lip、grille 和 rear diffuser。你把需求拆成四个独立部件，再确认年款、版本、材质和实车状态。"], ["DAY 4｜006", "REN", "what else?"], ["DAY 4｜006", "SERENA", "实车图。还有现在有没有改过前后杠、排气尾嘴、拖车钩或者传感器配置。"], ["DAY 4｜006", "REN", "exactly."], ["DAY 4｜006", "SERENA", "他从你身后伸手去拿钥匙。距离近得有点没必要。"], ["DAY 4｜006", "REN", "move."], ["DAY 4｜006", "SERENA", "你没动。"], ["DAY 4｜006", "REN", "…Serena."], ["DAY 5｜展会", "SERENA", "展会不是发传单。先观察工牌、公司、他在看什么、问什么、同行的人在做什么。一个人在样件背面研究安装位，可能比只问最低价的人更值得聊。"], ["DAY 5｜展会", "MARCO", "workshop. mostly Porsche and Lamborghini. cheap parts waste my mechanics’ time."], ["DAY 5｜展会", "SERENA", "你没有吹 fitment perfect，而是问他常做车型、目前最痛的是
