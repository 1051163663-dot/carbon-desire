<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070609;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}button{font:inherit}.game{position:fixed;inset:0;background:#100b10}.hud{position:absolute;z-index:30;top:0;left:0;right:0;height:58px;background:#0c090dcc;display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #ffffff25}.title{font:700 17px Georgia;color:#f0aac0;margin-right:auto}.chip{background:#1f171b;border:1px solid #875b69;padding:6px 8px;font-size:11px}.xp{position:absolute;top:58px;left:0;right:0;height:4px;background:#281b21;z-index:31}.xp i{display:block;height:100%;background:#e997b0}.stage{position:absolute;inset:62px 0 0;overflow:hidden;background:#21191d}.scene{position:absolute;inset:0;background:linear-gradient(#0002,#0007),url(build07_ui.png) center/cover;transition:.3s}.room{position:absolute;left:4%;right:4%;top:6%;bottom:10%;border:2px solid #9b6b79;background:linear-gradient(180deg,#b57b8d 0 58%,#5a3b42 58%);box-shadow:inset 0 0 80px #0007}.window{position:absolute;left:8%;top:8%;width:26%;height:30%;background:linear-gradient(#704d82,#e8a2ba);border:8px solid #ead7dc}.bed{position:absolute;right:8%;bottom:12%;width:30%;height:25%;background:#ead5db;border:7px solid #56383f}.desk{position:absolute;left:8%;bottom:14%;width:28%;height:17%;background:#573940;border-top:7px solid #d3a6b1}.avatar{position:absolute;left:48%;bottom:18%;font-size:64px;filter:drop-shadow(0 5px 3px #0007)}.obj{position:absolute;z-index:5;border:0;background:#f8eef0e8;color:#25191e;padding:8px 10px;border-radius:12px;font-weight:800;box-shadow:0 3px 10px #0007}.obj small{display:block;font-size:9px}.map{position:absolute;inset:0;background:linear-gradient(#5d4152,#1c151a),url(world.png) center/cover}.place{position:absolute;transform:translate(-50%,-50%);border:2px solid #f2b1c5;background:#171014e8;color:white;padding:10px;border-radius:15px;font-weight:900}.place . px}.avatar{font-size:48px}.chip:nth-of-type(3){display:none}}
</style></head><body><div class="game"><div class="hud"><div class="title">CARBON//DESIRE · V16 · CONNECTED WORLD</div><div class="chip" id="day"></div><div class="chip" id="loc"></div><div class="chip" id="money"></div><button class="chip" onclick="openPhone()">📱</button><button class="chip" onclick="openPanel('status')">☰</button></div><div class="xp"><i id="xp"></i></div><div class="stage" id="stage"></div><div class="progress" id="progress"></div></div>
<script>
let W,G,V9,C13,N14,V8,GD,CH16;let S=JSON.parse(localStorage.getItem("cd16")||"null")||{day:1,hour:9,min:20,loc:"home",lv:1,xp:12,energy:82,mood:64,money:8560,knowledge:1,biz:1,quest:[18,20,12,8,5],rels:{ren:2,ayo:3,hk:1,meng:1,adrian:0,marco:0,khalid:0},trust:{ren:10,ayo:22,hk:8,meng:6,adrian:15,marco:28,khalid:20},flags:{},seen:[],messages:[],orders:{khalid:"询盘",marco:"线索"},inv:["3DS","培训笔记","碳纤样板","展会名片×7","006门卡"]};const $=q=>document.querySelector(q);
async function boot(){[W,G,V9,C13,N14,V8,GD,CH16]=await Promise.all([fetch("./v11_world.json?v=16").then(r=>r.json()),fetch("./v10_game.json?v=16").then(r=>r.json()),fetch("./v9_beginner.json?v=16").then(r=>r.json()),fetch("./v13_content.json?v=16").then(r=>r.json()),fetch("./v14_systems.json?v=16").then(r=>r.json()),fetch("./v8_data.json?v=16").then(r=>r.json()),fetch("./game_data.json?v=16").then(r=>r.json()),fetch("./v16_chain.json?v=16").then(r=>r.json())]);S.orderStages=S.orderStages||{K001:1,M001:0};S.storyStep=S.storyStep||0;S.chainStep=S.chainStep||0;S.shipment=S.shipment||{qc:false,packed:false,tracking:false,feedback:false};S.learned=S.learned||[];S.pendingTasks=S.pendingTasks||[];S.supplierTrust=S.supplierTrust||{};S.completedTraining=S.completedTraining||[];S.readMsgs=S.readMsgs||[];tickUI();renderScene();setTimeout(()=>notify("Ayo","how's Guangzhou treating u"),1200);setTimeout(()=>incoming("Khalid"),4500);setTimeout(checkEvent,6500)}
function save(){localStorage.setItem("cd16",JSON.stringify(S));tickUI()}function tickUI(){$("#day").textContent=`DAY ${S.day} · ${String(S.hour).padStart(2,"0")}:${String(S.min).padStart(2,"0")}`;$("#loc").textContent=W?W.locations.find(x=>x.id===S.loc)?.name||S.loc:S.loc;$("#money").textContent=`¥${S.money}`;$("#xp").style.width=S.xp+"%";$("#progress").innerHTML=`LV.${S.lv} · EXP ${S.xp}/100<br>培训 ${S.quest[0]}%<div class="bar"><i style="width:${S.quest[0]}%"></i></div>产品图鉴 ${S.quest[1]}%<div class="bar"><i style="width:${S.quest[1]}%"></i></div>`}function time(m){S.min+=m;while(S.min>=60){S.min-=60;S.hour++}if(S.hour>=24){S.hour%=24;S.day++;S.energy=Math.min(100,S.energy+25)}save();setTimeout(checkInterruption,50)}function gain(x){S.xp+=x;while(S.xp>=100){S.xp-=100;S.lv++;toast(`LEVEL UP · LV.${S.lv}`)}save()}function renderScene(){tickUI();if(S.loc==="map"){renderMap();return}
let bgMap={home:"v13_cover.png",company:"v16_company_class.jpg",garage:"v16_006.jpg",warehouse:"v16_warehouse.jpg",expo:"v16_city_map.jpg",gym:"scene_gym.jpg",mall:"v16_city_map.jpg",bar:"scene_bar.jpg"};
let bg=bgMap[S.loc]||"v16_city_map.jpg";
$("#stage").innerHTML=`<div class="scene" style="background-image:linear-gradient(#0001,#0006),url(${bg});background-size:cover;background-position:center">${objects()}${npcButtons()}</div>`}function objects(){let a=(W.objects[S.loc]||[["🚪","离开","map"],["📱","手机","phone"]]).slice();if(S.loc==="company"){a.push(["📚","配件图册","partsmanual"]);a.push(["▶️","今日工作","storyflow"]);a.push(["🧑‍🏫","进入培训室","classroom"]);}
if(S.loc==="expo")a.push(["🎪","展会现场","expo16"]);
if(S.loc==="warehouse")a.push(["📦","查看订单货物","warehouse16"]);let pos=[[10,72],[23,48],[72,62],[87,72],[48,22]];return a.map((o,i)=>`<button class="obj" style="left:${pos[i%pos.length][0]}%;top:${pos[i%pos.length][1]}%" onclick="objectAct('${o[2]}')">${o[0]}<small>${o[1]}</small></button>`).join("")}function npcButtons(){return G.characters.filter(c=>isHere(c.id)).map((c,i)=>`<button class="obj" style="right:${8+i*14}%;top:28%" onclick="talk('${c.id}')">${c.portrait}<small>${c.name}</small></button>`).join("")}function isHere(id){if(id==="ren"&&S.loc==="garage"&&S.hour>=10)return true;if(id==="marco"&&S.loc==="expo"&&S.hour>=10&&S.hour<17)return true;if(id==="meng"&&((S.loc==="expo"&&S.hour>=15)||(S.loc==="bar"&&S.hour>=21)))return true;return false}
function objectAct(a){if(a==="map"){S.loc="map";renderMap();return}if(a==="phone"){openPhone();return}if(a==="sleep"){dialogue("SERENA",["你把手机扔到枕头边。","今天到这里。明天还有车要认。"],()=>{S.day++;S.hour=8;S.min=30;S.energy=100;S.loc="home";save();renderScene()});return}if(a==="3ds"){S.mood=Math.min(100,S.mood+12);time(60);dialogue("SYSTEM",["你决定先玩一小时。工作群不会因为你盯着它就自己变简单。","心情 +12。"]);return}if(a==="lesson"){lesson();return}if(a==="partsmanual"){partsManual();return}if(a==="storyflow"){storyFlow();return}
if(a==="classroom"){showVisual("v16_company_class.jpg","公司培训室 · 今天不是文字课");openPanel("calendar");return}
if(a==="expo16"){showVisual("v16_exhibition.jpg","展会 · 客户、名片、识别");dialogue("EXHIBITION",["你只有有限时间。不是每个路过的人都值得追。","先判断：终端客户、改装店、贸易商，还是纯问价。"],()=>{time(35);gain(8)});return}
if(a==="warehouse16"){showVisual("v16_warehouse.jpg","仓库 · K-001");openPanel("orders");return}if(a==="business"){openPanel("orders");return}if(a==="g63"){g63();return}if(a==="partsbox"){dialogue("SERENA",["一箱黑色零件。脱离整车以后它们又开始长得一模一样。","先别猜名字。先找：它大概装在车头、车侧还是车尾？"]);return}if(a==="qc"){if(S.day>=3){openPanel("install");return}dialogue("WAREHOUSE",["验货第一步不是摸两下说“质量不错”。","拍标签、数量、正反面、安装位、边缘、附件、包装。"]);return}dialogue("SYSTEM",[a+"：这个交互将在后续事件继续扩展。"])}
function renderMap(){$("#stage").innerHTML=`<div class="map" style="background-image:linear-gradient(#0003,#0004),url(v16_city_map.jpg);background-size:cover">${W.locations.map(l=>{let open=isOpen(l);let target=["company","company","company","garage","company","warehouse","warehouse","home"][Math.min(S.chainStep||0,7)];let badge=l.id===target?" ●当前任务":"";return `<button class="place ${open?"":"closed"}" style="left:${l.x}%;top:${l.y}%" onclick="go('${l.id}')"><span class="ico">${l.icon}</span>${l.name}<small>${open?" OPEN":" CLOSED"}${badge}</small></button>`}).join("")}</div>`}function isOpen(l){return S.hour>=l.open[0]&&S.hour<l.open[1]}function go(id){let l=W.locations.find(x=>x.id===id);if(!isOpen(l)){toast(`${l.name} 现在关门`);return}S.loc=id;S.energy=Math.max(0,S.energy-3);time(25);renderScene();setTimeout(checkEvent,250)}
function dialogue(who,lines,done){let i=0;let box=document.createElement("div");box.className="dialogue";document.querySelector(".stage").appendChild(box);function draw(){box.innerHTML=`<div class="speaker">${who}</div><div class="line">${lines[i]}</div><button class="next">▼</button>`;box.querySelector(".next").onclick=()=>{i++;if(i>=lines.length){box.remove();done&&done();return}draw()}}draw()}
function talk(id){let c=G.characters.find(x=>x.id===id);let lines=id==="ren"?["you're late.","你低头看时间。你只迟到了四分钟。","Ren: four minutes is late.","Serena: then stop texting me to come here","Ren: come here. rear of the G63. point first, name second."]:id==="marco"?["Marco 把手机里一张安装缝隙的照片放大。","Marco: This is what I mean. Cheap part, expensive mechanic time.","Serena: gap issue? or mounting points?","Marco: Both on the last supplier.","Serena: then let's test the 2 SKUs u install most."]:["你们聊了一会。"];dialogue(c.name,lines,()=>{S.trust[id]=Math.min(100,(S.trust[id]||0)+4);if(["ren","meng"].includes(id))S.rels[id]=Math.min(5,(S.rels[id]||0)+1);time(20);gain(8)})}
function g63(){showVisual("v16_006.jpg","006 · G63 实车");dialogue("REN",["don't name it yet. tell me where it is.","Serena: 车屁股最下面，排气附近。","Ren: good. now name it.","Serena: rear diffuser?","Ren: there u go.","你终于不是靠死背“后扩散器”四个字，而是先从位置认出了它。"],()=>{S.knowledge++;S.quest[1]=Math.min(100,S.quest[1]+4);gain(12)})}

async function storyFlow(){
  const steps=[
    ["毛总",["今天不背词。先看一条你真的会在工作里遇到的标题。","BMW G82 M4 2021+ MP Style Dry Carbon Front Lip","Serena: ……每个词我都认识一点，合起来像咒语。","先拆。G82 是车，Front Lip 是部位，Dry Carbon 是材质。其他东西慢慢来。"]],
    ["PHONE",["💬 Khalid: m4 2024 need carbon front. best price?","上午刚出现的 Front Lip，下午客户就真的问到了。","你现在有两个选择：装懂直接报价，或者先把车和零件确认完整。"]],
    ["SERENA",["先不报价。","G82 M4 Competition? front lip only, right? send me one front pic too pls","你第一次把“课上的词”用进了真实询盘。"]],
    ["SUPPLIER",["你打开之前做过的供应商资料。","不是只发：price?","你把车型、年份、部位、材质、finish、数量和库存一起问。"]],
    ["REN",["晚上去 006。Ren 指着一台车的最下沿。","Ren: don't read the catalog. show me where the lip actually sits.","你先从位置认，再把英文和实物对上。"]],
    ["KHALID",["Serena: confirmed the fitment direction. I'm checking actual stock + dispatch date now.","Khalid: ok send me final when ready","订单没有神奇地“成交”。它只是从询盘推进到了下一步。"]]
  ];
  let i=Math.min(S.storyStep,steps.length-1), st=steps[i];
  if(i===0) showVisual("parts_front.png","今天的课：先看位置，再拆产品标题");
  if(i===1) showPartDiagram("Front Lip");
  if(i===3) setTimeout(()=>openPanel("suppliers"),500);
  if(i===4){S.loc="garage";renderScene();showVisual("v16_006.jpg","006 · 把课上的词变成实车");}
  dialogue(st[0],st[1],()=>{
    if(i===0){S.learned.push("Front Lip");S.quest[1]=Math.min(100,S.quest[1]+4)}
    if(i===1){S.trust.khalid=Math.min(100,S.trust.khalid+3)}
    if(i===2){S.orderStages.K001=Math.max(S.orderStages.K001||0,2);S.biz++}
    if(i===3){S.orderStages.K001=Math.max(S.orderStages.K001||0,3)}
    if(i===4){S.rels.ren=Math.min(5,(S.rels.ren||0)+1);S.knowledge++}
    if(i===5){S.orderStages.K001=Math.max(S.orderStages.K001||0,3)}
    S.storyStep=Math.min(steps.length,S.storyStep+1);time(20);gain(12);save()
  })
}
function showPartDiagram(term){
  const map={"Front Lip":"diagram_front_lip.svg","Front Bumper":"diagram_front_bumper.svg","Grille":"diagram_grille.svg","Hood/Bonnet":"diagram_hood.svg","Fender":"diagram_fender.svg","Side Skirt":"diagram_side_skirt.svg","Rear Bumper":"diagram_rear_bumper.svg","Rear Diffuser":"diagram_diffuser.svg","Spoiler/Wing":"diagram_spoiler.svg","Mirror Cap":"diagram_mirror.svg","Exhaust Tips":"diagram_tips.svg","Widebody Kit":"diagram_widebody.svg"};
  if(map[term])showVisual(map[term],term+" · 以前做过的简图，现在真正进剧情")
}
function contextualLesson(term){
  let x=(V9.beginner||[]).find(a=>a.term===term);
  if(!x)return;
  showPartDiagram(term);
  dialogue("TRAINING",[`${x.term} = ${x.cn}`,x.baby,`📍 ${x.where}`,`现在不是为了考试记它：Khalid 的询盘马上会用到。`])
}

function partsManual(){document.querySelector(".panel")?.remove();let p=document.createElement("div");p.className="panel";p.innerHTML=`<button class="close" onclick="this.parentNode.remove()">×</button><h2>📚 PARTS MANUAL · 实图大卡</h2><p>别背一堆字。一次看一个区域：先找位置，再记英文。</p><div class="grid"><div class="card" onclick="contextualLesson('Front Lip')"><h3>🚘 车头 FRONT</h3><img src="parts_front.png" style="width:100%"><p>Front lip / bumper / grille / hood 等。</p></div><div class="card" onclick="contextualLesson('Rear Diffuser')"><h3>🚗 车尾 REAR</h3><img src="parts_rear.png" style="width:100%"><p>Rear bumper / diffuser / spoiler / exhaust tips。</p></div><div class="card" onclick="showVisual('parts_detail.png','局部细节')"><h3>🔎 局部 DETAIL</h3><img src="parts_detail.png" style="width:100%"><p>把零件从整车里单独认出来。</p></div><div class="card" onclick="showVisual('parts_exploded.png','拆解图')"><h3>🧩 拆解 EXPLODED</h3><img src="parts_exploded.png" style="width:100%"><p>理解一套 body kit 到底由哪些件组成。</p></div><div class="card" onclick="showVisual('parts_atlas.png','全部部件总览')"><h3>🗺️ ATLAS</h3><img src="parts_atlas.png" style="width:100%"><p>复习时再看总览，不拿它当第一课。</p></div></div>`;document.body.appendChild(p)}
function lesson(){showVisual("scene_tutorial.jpg","汽车部位图解");let x=V9.beginner[Math.floor(Math.random()*V9.beginner.length)];dialogue("TRAINING",[`${x.term} = ${x.cn}`,x.baby,`📍 ${x.where}`,`工作时：${x.check}`],()=>{S.knowledge++;S.quest[0]=Math.min(100,S.quest[0]+2);S.quest[1]=Math.min(100,S.quest[1]+3);time(30);gain(10)})}
function business(){dialogue("KHALID",["M4 2024. carbon front lip. best price?","Serena: got u. G82 M4 Competition? send me one front pic too — I wanna check the exact fitment.","Khalid: why pic? 2024 is enough no?","Serena: year helps, but bumper/version can still matter. takes me 2 mins now, saves both of us a headache later.","Khalid: fair. dry carbon glossy. [PHOTO]","Serena: perfect. checking actual product + ready stock now. where in Dubai for shipping?","Khalid: Al Quoz."],()=>{S.biz++;S.trust.khalid+=6;S.quest[2]=Math.min(100,S.quest[2]+10);time(25);gain(15)})}
function openPhone(){let p=document.createElement("div");p.className="phone";p.id="ph";p.innerHTML=`<button class="close" onclick="document.querySelector('#ph').remove()">×</button><h2>PHONE</h2>${N14.messages.filter(m=>S.day>=m.delay+1).map((m,i)=>`<div class="bubble" onclick="readTimedMsg(${i})"><b>${S.readMsgs.includes(i)?"":"● "}${m.from}</b> <small>${m.at}</small><br>${m.text}</div>`).join("")}<hr>${G.characters.map(c=>`<div class="bubble" onclick="phoneChat('${c.id}')"><b>${c.name}</b><br>${c.msgs[0]}</div>`).join("")}<hr><button onclick="openPanel('chars')">♥ Relationships</button> <button onclick="openPanel('inv')">🎒 Bag</button>`;document.body.appendChild(p)}
function readTimedMsg(i){let m=N14.messages[i];if(!S.readMsgs.includes(i))S.readMsgs.push(i);document.querySelector("#ph")?.remove();save();dialogue(m.from,[`${m.from}: ${m.text}`],()=>gain(2))}
function phoneChat(id){document.querySelector("#ph")?.remove();let c=G.characters.find(x=>x.id===id);let lines=id==="ayo"?["Ayo: how's Guangzhou treating u","Serena: alive. learning cars against my will","Ayo: 😂 show me what ur working on","Serena: when i can finally tell the parts apart"] : id==="hk"?["HK Boy: 仲未瞓？","Serena: 仲学紧车 😭","HK Boy: 你真系去做改装啊","Serena: 唔系我改 我卖啊大佬"] : c.msgs.map(x=>`${c.name}: ${x}`);dialogue(c.name,lines,()=>{S.trust[id]=Math.min(100,(S.trust[id]||0)+2);gain(4)})}
function notify(id,msg){let c=G.characters.find(x=>x.id===id.toLowerCase())||G.characters.find(x=>x.name===id);toast(`💬 ${id}: ${msg}`)}
function incoming(name){if(document.querySelector(".incoming"))return;let d=document.createElement("div");d.className="incoming";d.innerHTML=`<div>📞 INCOMING CALL</div><div class="who">${name}</div><button class="callbtn" onclick="this.parentNode.remove()">❌</button><button class="callbtn" onclick="answerCall('${name}');this.parentNode.remove()">📞</button>`;document.body.appendChild(d)}
function answerCall(name){if(name==="Khalid")dialogue("KHALID · CALL",["Hey Serena, you got the M4 lip?","Serena: I'm checking the exact part now. dry carbon glossy, G82 Competition, right?","Yes. I need it fast.","Serena: I won't promise dispatch until I confirm ready stock. gimme 10 mins and I'll text u the actual status.","Good. Send shipping too."],()=>{S.trust.khalid+=5;gain(8)})}
function openPanel(type){document.querySelector(".panel")?.remove();let p=document.createElement("div");p.className="panel";let body="";if(type==="status")body=`<h2>SERENA · LV.${S.lv}</h2><p>EXP ${S.xp}/100 · 体力 ${S.energy} · 心情 ${S.mood} · ¥${S.money}</p><h3>任务</h3>${G.quests.map((q,i)=>`<p><b>${q.name}</b> ${S.quest[i]}%</p><div class="bar"><i style="width:${S.quest[i]}%"></i></div>`).join("")}<button onclick="openPanel('chars')">♥ 人物</button> <button onclick="openPanel('inv')">🎒 道具</button> <button onclick="openPanel('cars')">🚗 车型</button> <button onclick="openPanel('ach')">🏆 成就</button> <button onclick="openPanel('orders')">📦 订单</button> <button onclick="openPanel('suppliers')">🏭 供应商</button> <button onclick="openPanel('calendar')">🗓 培训</button> <button onclick="openPanel('install')">🔧 安装案例</button> <button onclick="openPanel('route')">🧵 当前故事链</button> <button onclick="openPanel('schedule16')">📅 日程</button>`;if(type==="chars")body=`<h2>RELATIONSHIPS</h2><div class="grid">${G.characters.map(c=>`<div class="card"><h3>${c.portrait} ${c.name}</h3><div class="heart">${"♥".repeat(S.rels[c.id]||0)}${"♡".repeat(5-(S.rels[c.id]||0))}</div><p>信任 ${S.trust[c.id]||0}/100</p><small>${c.route}</small></div>`).join("")}</div>`;if(type==="inv")body=`<h2>🎒 BAG</h2><div class="grid">${G.items.map(x=>`<div class="card"><h3>${x.icon} ${x.name}</h3><p>${x.desc}</p></div>`).join("")}</div>`;if(type==="cars")body=carPanel();if(type==="ach")body=achPanel();if(type==="orders")body=orderPanel();if(type==="suppliers")body=supplierPanel();if(type==="calendar")body=calendarPanel();if(type==="install")body=installPanel();if(type==="route")body=routePanel();if(type==="schedule16")body=schedule16();p.innerHTML=`<button class="close" onclick="this.parentNode.remove()">×</button>${body}`;document.body.appendChild(p)}
function showVisual(src,label){let old=document.querySelector(".visualcard");if(old)old.remove();let d=document.createElement("div");d.className="visualcard";d.style.cssText="position:absolute;z-index:45;left:2%;top:5%;width:38%;height:42%;background:#111;border:2px solid #e997b0;box-shadow:0 8px 30px #000;overflow:hidden";d.innerHTML=`<img src="${src}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;left:8px;bottom:8px;background:#000c;padding:6px">${label}</div>`;document.querySelector(".stage").appendChild(d);setTimeout(()=>d.remove(),9000)}




function schedule16(){
 const rows=[
 ["09:00","公司","培训 / 产品"],
 ["11:00","手机","客户确认"],
 ["13:00","仓库","库存 / QC"],
 ["16:00","006","实车 / Ren"],
 ["20:00","自由","人物 / 生活"],
 ["23:00","公寓","整理订单"]
 ];
 return `<img class="hero" src="v16_schedule.jpg"><h2>📅 DAY ${S.day} SCHEDULE</h2>${rows.map((r,i)=>`<div class="card"><b>${r[0]} · ${r[1]}</b><p>${r[2]}</p></div>`).join("")}`;
}

function routePanel(){
 let st=S.chainStep||0;
 return `<img class="hero" src="v16_schedule.jpg"><h2>🧵 CONNECTED STORY</h2><p>现在所有旧系统都从这条链互相调用。你不是在“选模块”，而是在处理同一件事。</p>
 ${CH16.chapters.map((c,i)=>`<div class="card" style="opacity:${i<=st?1:.35}"><h3>${i<st?"✓":i===st?"▶":"🔒"} ${c.name}</h3></div>`).join("")}
 <button onclick="runChain()">继续当前事件</button>`;
}
function runChain(){
 let st=S.chainStep||0;
 if(st===0){S.loc="company";renderScene();showVisual("parts_front.png","上午培训 · G82 Front Lip");contextualLesson("Front Lip");S.chainStep=1;save();return}
 if(st===1){dialogue("KHALID",["m4 2024 need carbon front. best price?","Serena: G82 M4 Competition? front lip only? send me one front pic too pls","Khalid: yes why pic","Serena: just checking exact fitment before I quote. dry carbon glossy?","Khalid: yes"],()=>{S.orderStages.K001=Math.max(2,S.orderStages.K001||0);S.trust.khalid+=4;S.chainStep=2;time(20);gain(12);save();openPanel("route")});return}
 if(st===2){openPanel("suppliers");toast("先向供应商确认真实库存、材质、finish、dispatch date。询价后故事链会推进。");S.chainStep=3;save();return}
 if(st===3){S.loc="garage";renderScene();showVisual("v16_006.jpg","006 · 同一个零件，现在看实车");dialogue("REN",["G82 is on the lift.","Ren: show me the lip. don't say the word first.","你指向前杠最下面那一条。","Ren: good. now say it.","Serena: front lip.","Ren: finally."],()=>{S.rels.ren=Math.min(5,(S.rels.ren||0)+1);S.knowledge++;S.chainStep=4;time(35);gain(15);save()});return}
 if(st===4){S.loc="company";renderScene();dialogue("SERENA",["车型、版本、材质、finish、库存都确认完了。","现在才轮到正式报价。","你把产品价和运输分开写，不把未知项假装成确定项。"],()=>{S.orderStages.K001=Math.max(4,S.orderStages.K001||0);S.chainStep=5;S.biz++;gain(14);save();openPanel("orders")});return}
 if(st===5){S.loc="warehouse";renderScene();showVisual("v16_warehouse.jpg","K-001 · QC");dialogue("WAREHOUSE",["先拍外箱和标签。","再拍产品正反面、边缘、安装位、附件。","最后记录包装尺寸和重量。","这不是仓库小游戏——这些照片属于 Khalid 的 K-001 订单。"],()=>{S.shipment.qc=true;S.shipment.packed=true;S.orderStages.K001=Math.max(7,S.orderStages.K001||0);S.chainStep=6;time(50);gain(16);save()});return}
 if(st===6){dialogue("LOGISTICS",["K-001 已完成 QC 与包装。","你保存物流单号，并把发货证据发给 Khalid。","Khalid: got it"],()=>{S.shipment.tracking=true;S.orderStages.K001=Math.max(8,S.orderStages.K001||0);S.chainStep=7;time(15);gain(12);save()});return}
 if(st>=7){dialogue("KHALID",["installed.","fitment good.","Serena: perfect. send me one installed pic when u have time 🙏","这张安装反馈会反过来成为以后同款询盘的 fitment 证据。"],()=>{S.shipment.feedback=true;S.orderStages.K001=9;S.trust.khalid=Math.min(100,S.trust.khalid+10);gain(20);save()});}
}
function checkInterruption(){
 if(!CH16)return;
 let e=CH16.interruptions.find(x=>x.day===S.day&&x.hour===S.hour&&!S.flags["int_"+x.from+"_"+x.day]);
 if(!e)return;
 S.flags["int_"+e.from+"_"+e.day]=true;save();toast(`💬 ${e.from}: ${e.text}`);
}

function orderPanel(){return `<img class="hero" src="v16_orders.jpg"><h2>📦 ORDER PIPELINE</h2><p>订单不是“成交/没成交”两个状态。每一步都可能卡住。</p>${N14.orders.map((o,oi)=>{let key=oi===0?"K001":"M001",st=S.orderStages[key]||0;return `<div class="card"><h3>${o.id} · ${o.client}</h3><p>${o.car}<br>${o.item} · ${o.material}</p><p>⚠ ${o.risk}</p><div class="bar"><i style="width:${Math.round(st/(o.stages.length-1)*100)}%"></i></div><b>${o.stages[st]}</b><p>${o.stages.map((x,i)=>`${i<=st?"●":"○"} ${x}`).join(" → ")}</p><button onclick="advanceOrder('${key}',${oi})">处理下一步</button></div>`}).join("")}`}
function advanceOrder(key,oi){let o=N14.orders[oi],st=S.orderStages[key]||0;if(st>=o.stages.length-1){toast("这条订单已经走完当前流程");return}let prompts=["先把缺失信息补齐。","核实产品/车辆适配。","向供应商查真实成本与库存。","把产品价、条件和运输拆清楚。","记录客户确认，不靠口头记忆。","确认到账状态。","留完整 QC 证据。","记录尺寸、重量与包装状态。","保存物流单号和发货证据。","等安装反馈，问题要闭环。"];dialogue("ORDER",[`${o.id} · ${o.stages[st]} → ${o.stages[st+1]}`,prompts[Math.min(st,prompts.length-1)]],()=>{S.orderStages[key]=st+1;S.biz++;gain(10+st);save();openPanel("orders")})}
function supplierPanel(){return `<img class="hero" src="v16_warehouse.jpg"><h2>🏭 SUPPLIER CRM</h2><p>同一个产品，不是找到最低价就结束。回复速度、可信度、交期和证据都要记。</p><div class="grid">${N14.suppliers.map(x=>`<div class="card"><h3>${x.name}</h3><b>${x.focus}</b><p>可靠度 ${x.reliability}/100<br>平均回复 ${x.reply} min<br>Lead time ${x.lead}</p><p>${x.note}</p><button onclick="askSupplier('${x.id}')">发询价</button></div>`).join("")}</div>`}
function askSupplier(id){let x=N14.suppliers.find(a=>a.id===id);dialogue(x.name,["Serena: Hi, checking actual stock + price for one item. I'll send exact car/version and product photo.","Supplier: send details","Serena: also pls confirm material, finish, qty available and earliest dispatch date.","你没有只问“best price”，而是一次把之后会卡你的信息一起问了。"],()=>{S.supplierTrust[id]=(S.supplierTrust[id]||0)+5;if(S.chainStep===3)S.chainStep=3;time(15);gain(9)})}
function calendarPanel(){let d=Math.min(20,S.day);return `<img class="hero" src="v16_company_class.jpg"><h2>🗓 20-DAY TRAINING</h2><p>今天 Day ${S.day}。不是把20天一次性读完，而是每天解锁一个工作能力。</p><div class="grid">${N14.training.map(x=>`<div class="card" style="opacity:${x.day<=S.day?1:.35}"><h3>DAY ${x.day}</h3><b>${x.topic}</b><p>${x.day<=S.day?(S.completedTraining.includes(x.day)?"✓ 已完成":"今天/可补课"):"🔒 未到日期"}</p>${x.day<=S.day&&!S.completedTraining.includes(x.day)?`<button onclick="trainDay(${x.day})">开始</button>`:""}</div>`).join("")}</div>`}
function trainDay(d){let x=N14.training[d-1];dialogue("TRAINING",[x.goal,"这一课不会假装你已经会了。完成后只代表你接触并练过一次。"],()=>{S.completedTraining.push(d);S.quest[0]=Math.min(100,S.quest[0]+4);S.knowledge++;time(45);gain(x.reward);save();openPanel("calendar")})}
function installPanel(){return `<h2>🔧 INSTALL / AFTER-SALES CASES</h2><p>这里练的不是背单词，是“东西不对的时候你怎么办”。</p>${N14.install_cases.map((c,i)=>`<div class="card"><h3>${c.name}</h3><p>${c.problem}</p>${c.choices.map((x,j)=>`<button class="choices" onclick="solveInstall(${i},${j})">${j+1}. ${x}</button>`).join("")}</div>`).join("")}`}
function solveInstall(i,j){let c=N14.install_cases[i];if(j===c.correct){dialogue("CASE",["处理正确。",c.why],()=>{gain(12);S.biz++;save()})}else{dialogue("CASE",["这个处理会把风险继续往后推。",c.why],()=>{S.mood=Math.max(0,S.mood-2);save()})}}
function dailyClose(){let spend=N14.expenses[(S.day-1)%N14.expenses.length];dialogue("DAY END",[`${spend[0]}支出 ¥${spend[1]}`,`今天处理订单：K-001 ${N14.orders[0].stages[S.orderStages.K001||0]}`,`培训完成 ${S.completedTraining.length}/20`,`未读消息会留到明天，不会因为睡觉消失。`],()=>{S.money-=spend[1];S.day++;S.hour=8;S.min=30;S.energy=100;S.loc="home";save();renderScene()})}

function checkEvent(){if(!C13)return;let candidates=C13.events.filter(e=>e.loc===S.loc&&S.day>=e.minDay&&S.hour>=e.hour[0]&&S.hour<e.hour[1]&&!S.seen.includes(e.id));if(!candidates.length)return;let e=candidates[0];S.seen.push(e.id);save();dialogue(e.who,[`【${e.title}】`,...e.lines],()=>{gain(e.xp||5);if(e.id==="ren_g63")S.rels.ren=Math.min(5,S.rels.ren+1);if(e.id==="marco_expo")S.trust.marco+=7;if(e.id==="ayo_night")S.rels.ayo=Math.min(5,S.rels.ayo+1);save()})}
function carPanel(){return `<h2>🚗 CAR CODEX · ${C13.cars.length} 台</h2><div class="grid">${C13.cars.map(c=>`<div class="card"><h3>${c.name}</h3><b>${c.gen}</b>${c.learn.map(x=>`<p>• ${x}</p>`).join("")}</div>`).join("")}</div>`}
function achPanel(){return `<h2>🏆 ACHIEVEMENTS</h2>${C13.achievements.map((a,i)=>`<div class="card"><h3>${S.seen.length>i*5?"🏆":"🔒"} ${a[0]}</h3><p>${a[1]}</p></div>`).join("")}`}
function toast(t){let d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}boot();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
