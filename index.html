</style></head><body><div class="app"><header class="top"><div class="logo">CARBON//DESIRE · BUILD 0.7</div><div class="pill" style="border-color:#e996af;color:#f3b2c6">V7 LIVE</div><div class="pill" id="clock"></div><div class="pill" id="cash"></div><button class="pink" onclick="phone()">📱</button></header><div class="body"><nav class="nav"><button onclick="home()">⌂ 首页</button><button onclick="schedule()">☀ 自由行动</button><button onclick="story()">♥ 主线/GAL</button><button onclick="parts()">🚗 配件大图</button><button onclick="cars()">🏎 车型</button><button onclick="customerHub()">💬 客户模拟</button><button onclick="fitment()">🔧 Fitment</button><button onclick="inventory()">📦 库存/报价</button><button onclick="calendar()">▦ 日历</button><button onclick="log()">▤ 日志</button><button onclick="save()">💾 保存</button><button onclick="reset()">↻ 新游戏</button></nav><main id="main" class="main"></main><aside class="side"><h3>STATUS</h3><div id="status"></div><h3>今天</h3><div class="small" id="tasks"></div></aside></div><div class="phone" id="phone"><button class="close" onclick="phone()">×</button><h2>PHONE</h2><div class="chat"><b>Khalid</b><br>m4 2024 need carbon front. best price?</div><div class="chat"><b>Ren</b><br>u coming or playing that little game again</div><div class="chat"><b>Marco</b><br>send me 992 options when free</div><button class="pink" onclick="customerHub();phone()">WhatsApp</button></div><div class="modal" id="modal"><button class="close" onclick="closeM()">×</button><div id="mb"></div></div></div><script>
let D=null;let S=JSON.parse(localStorage.getItem("cd07")||"null")||{day:1,hour:9,energy:82,mood:65,money:8560,skill:1,biz:1,ren:1,loc:"公司",story:0,seen:[],logs:[],tasks:{learn:false,biz:false,ren:false},stock:[["G82 front lip dry carbon",2,1850,3100],["G63 rear diffuser dry carbon",1,4200,6800],["992 spoiler carbon",3,2200,3900]]};const $=q=>document.querySelector(q);
async function boot(){D=await fetch("./game_data.json?v=7").then(r=>r.json());render();home()}function save(){localStorage.setItem("cd07",JSON.stringify(S));render()}function render(){$("#clock").textContent=`DAY ${S.day} · ${String(S.hour).padStart(2,"0")}:00 · ${S.loc}`;$("#cash").textContent=`¥${S.money}`;$("#status").innerHTML=`体力 ${S.energy}/100<div class="bar"><i style="width:${S.energy}%"></i></div>心情 ${S.mood}/100<div class="bar"><i style="width:${S.mood}%"></i></div>改装知识 Lv.${S.skill}<div class="bar"><i style="width:${Math.min(100,S.skill*7)}%"></i></div>业务 Lv.${S.biz}<div class="bar"><i style="width:${Math.min(100,S.biz*7)}%"></i></div>Ren ♥ ${S.ren}/10<div class="bar"><i style="width:${S.ren*10}%"></i></div>`;$("#tasks").innerHTML=`${S.tasks.learn?"✅":"⬜"} 学 1 个部件<br>${S.tasks.biz?"✅":"⬜"} 做 1 次业务<br>${S.tasks.ren?"✅":"⬜"} 可选：006 / Ren`}function advance(h){S.hour+=h;while(S.hour>=24){S.hour-=24;nextDay()}save()}function nextDay(){S.day++;S.energy=Math.min(100,S.energy+30);S.tasks={learn:false,biz:false,ren:false};if(S.day===11)popup("培训阶段变化","你已经完成前 10 天基础训练。地图开始出现“迪拜准备”相关事件；游戏不会在这里结束。")}function home(){$("#main").innerHTML=`<section class="hero"><h1>GUANGZHOU · DAY ${S.day}</h1><p>第七版：生活模拟、GAL 主线、汽车知识、客户业务、库存报价和自由行动继续合并成一个世界。白天培训和做生意，晚上去 006、休息或社交；选择会推进时间、能力、钱和人物关系。</p><div><button class="pink" onclick="schedule()">开始行动</button><button class="pink" onclick="story()">继续主线</button></div></section>`}function schedule(){$("#main").innerHTML=`<section class="sheet"><h2>今天去哪里？</h2><div class="grid">${D.locations.map((l,i)=>{let open=isOpen(l);return `<button class="card ${open?"":"locked"}" onclick="travel(${i})"><h3>${l.icon} ${l.name}</h3><p>${l.desc}<br><small>${l.hours[0]}:00–${l.hours[1]>24?l.hours[1]-24+"+凌晨":l.hours[1]+":00"} · ${open?"开放":"当前关闭"}</small></p></button>`}).join("")}</div></section><section class="sheet"><h2>当前位置 · ${S.loc}</h2>${actionsForLoc()}</section>`}function isOpen(l){let h=S.hour;let end=l.hours[1];return end>24?(h>=l.hours[0]||h<end-24):(h>=l.hours[0]&&h<end)}function travel(i){let l=D.locations[i];if(!isOpen(l)){popup("现在关门","这个地点当前时间不可进入。你可以先做别的事或回家。");return}S.loc=l.name;S.energy=Math.max(0,S.energy-3);advance(l.travel);schedule()}function actionsForLoc(){let a={公司:["产品训练","处理客户","供应商搜索","整理报价"],"006 改装店":["看实车","帮 Ren 找件","安装观察","留下到关门"],仓库:["验货","检查包装","盘库存"],展会:["开发客户","观察竞品","整理线索"],公寓:["睡觉","玩 3DS","复习图鉴","刷手机"],健身房:["健身"],商场:["吃饭","停车场认车"],酒吧:["喝一杯","社交"]}[S.loc]||[];return `<div class="grid">${a.map(x=>`<button class="card" onclick="doAct('${x}')"><h3>${x}</h3><p>时间会推进；部分行动触发事件。</p></button>`).join("")}</div>`}function doAct(x){let cost=2,energy=-10;if(x==="睡觉"){S.hour=8;S.energy=100;S.mood=Math.min(100,S.mood+10);nextDay();save();schedule();return}if(x==="玩 3DS"){S.mood=Math.min(100,S.mood+13);energy=2}if(x==="吃饭"){S.money-=45;S.energy=Math.min(100,S.energy+15);cost=1;energy=0}if(x==="健身"){S.mood=Math.min(100,S.mood+6);energy=-14}if(["处理客户","供应商搜索","整理报价","开发客户","整理线索"].includes(x)){S.biz++;S.tasks.biz=true}if(["产品训练","看实车","安装观察","验货","检查包装","复习图鉴","停车场认车"].includes(x))S.skill++;if(x.includes("Ren")||x==="留下到关门"){S.ren=Math.min(10,S.ren+1);S.tasks.ren=true;S.mood=Math.min(100,S.mood+4)}S.energy=Math.max(0,S.energy+energy);S.logs.unshift(`Day ${S.day} ${S.hour}:00 · ${S.loc} · ${x}`);advance(cost);eventFor(x)}function eventFor(x){let txt={产品训练:"毛总没有让你背产品名。他随机发来一张局部图，让你先说“位置”，再说英文。",处理客户:"Khalid 又问 best price。你先补齐 fitment 信息，而不是拿一个数字结束对话。",供应商搜索:"两个页面标题几乎一样，一个说 ready stock，一个实际要生产。你开始建立供应商可靠性备注。",看实车:"Ren 把手机灯照到车底：`name it.` 这次你不是从中文翻英文，而是真的从车上认。","帮 Ren 找件":"你从一堆黑色件里找到了正确的左右侧裙。Ren 看了一眼：`okay, ur useful now.`",安装观察:"你看到技师为了一个孔位差异重新调整。所谓 fitment suddenly becomes very expensive.",验货:"你翻背面看孔位、边缘、附件，再拍标签和包装。",开发客户:"你没有发全目录，而是先问对方 workshop 高频车型。",玩3DS:"你关掉工作群半小时。奇怪的是，休息以后你反而记得更清楚。"}[x]||`你完成了「${x}」。今天的时间继续往前走。`;popup(`${S.loc} · ${x}`,txt)}function story(){let c=D.chapters[S.story%D.chapters.length];$("#main").innerHTML=`<div class="story"><div class="title">${c[0]}</div><div class="who">${c[1]}</div><p>${c[2]}</p><button class="choice" onclick="storyChoice(0)">继续听 / 观察</button><button class="choice" onclick="storyChoice(1)">主动回应</button>${c[1]==="Ren"?'<button class="choice" onclick="storyChoice(2)">靠近一点，但不说破</button>':""}<button class="choice" onclick="parts()">暂时打开配件图鉴</button></div>`}function storyChoice(n){if(n===1)S.biz++;if(n===2){S.ren=Math.min(10,S.ren+1);S.mood=Math.min(100,S.mood+4)}S.story++;S.logs.unshift(`主线 ${D.chapters[(S.story-1)%D.chapters.length][0]}`);advance(1);story()}function parts(){$("#main").innerHTML=`<section class="sheet"><h2>配件库 · ${S.seen.length}/${D.parts.length}</h2><p>每件单独一页。大字、中文、位置、业务检查点。</p><div class="grid">${D.parts.map((p,i)=>`<button class="card" onclick="part(${i})"><h3>${p[1]}</h3><div style="font-size:22px">${p[2]}</div><p>📍 ${p[3]}</p></button>`).join("")}</div></section>`}function part(i){let p=D.parts[i];$("#main").innerHTML=`<section class="sheet visual"><div><img class="big" src="${p[4]}" onclick="zoom('${p[4]}')"></div><div><div class="term">${p[1]}</div><div class="cn">${p[2]}</div><h3>📍 ${p[3]}</h3><p style="font-size:18px;line-height:1.7">${p[5]}</p><p><b>业务检查：</b>${p[6]}</p><button class="pink" onclick="learn(${i})">完成视觉学习</button><button class="pink" onclick="partQuiz(${i})">客户图识别模拟</button></div></section>`}function learn(i){if(!S.seen.includes(i)){S.seen.push(i);S.skill++;S.tasks.learn=true;S.logs.unshift(`学会 ${D.parts[i][1]} / ${D.parts[i][2]}`)}advance(1);part(i)}function partQuiz(i){let p=D.parts[i],opts=[p,...D.parts.filter((_,j)=>j!==i).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);$("#mb").innerHTML=`<h2>客户只圈了这个位置：${p[3]}</h2><p>你会优先确认哪一个部件？</p>${opts.map(o=>`<button class="quizOption" onclick="quizAnswer('${o[0]}','${p[0]}')">${o[1]} · ${o[2]}</button>`).join("")}`;$("#modal").style.display="block"}function quizAnswer(a,b){$("#mb").innerHTML=a===b?`<h2 class="ok">识别方向正确</h2><p>下一步不是直接报价，而是继续确认车型/版本/材质/fitment。</p>`:`<h2>再看位置</h2><p>这不是考试扣分。客户不会告诉你“错了”，现实后果是你会继续问错产品。所以回去重新看整车位置。</p>`}function cars(){$("#main").innerHTML=`<section class="sheet"><h2>车型库</h2><div class="grid">${D.cars.map((c,i)=>`<button class="card" onclick="car(${i})"><h3>${c[0]}</h3><p>${c[2]} · ${c[3]}<br>${c[4]}</p></button>`).join("")}</div></section>`}function car(i){let c=D.cars[i];$("#main").innerHTML=`<section class="sheet"><h2>${c[0]}</h2><p><span class="tag">${c[1]}</span><span class="tag">${c[2]}</span><span class="tag">${c[3]}</span><span class="tag">${c[4]}</span></p><p style="font-size:18px;line-height:1.7">${c[5]}</p><h3>业务拆解</h3><p>MAKE → MODEL → YEAR/GENERATION → VERSION/TRIM → STYLE → PART → MATERIAL → FITMENT → QTY → QUOTE</p><button class="pink" onclick="parts()">去配件库</button></section>`}function customerHub(){$("#main").innerHTML=`<section class="sheet"><h2>客户模拟器</h2><p>客户的预算、耐心、专业度和购买意图不是直接显示给你的“游戏数值”。你只能从事实推测，再用问题验证。</p><div class="grid">${D.customers.map((c,i)=>`<button class="card" onclick="customer(${i})"><h3>${c.name}</h3><p>${c.type}</p><p>“${c.msg}”</p></button>`).join("")}</div></section>`}function customer(i){let c=D.customers[i];$("#main").innerHTML=`<section class="sheet"><h2>${c.name}</h2><div class="chat">${c.msg}</div><h3>已知事实</h3>${c.facts.map(x=>`<span class="tag">${x}</span>`).join("")}<h3>下一步验证</h3>${c.verify.map(x=>`<p>• ${x}</p>`).join("")}<button class="pink" onclick="reply(${i},0)">先确认信息</button><button class="pink" onclick="reply(${i},1)">直接报最低价</button><button class="pink" onclick="reply(${i},2)">丢完整目录</button></section>`}function reply(i,n){S.tasks.biz=true;if(n===0){S.biz++;S.money+=120;popup("客户继续回复","你没有神奇地“成交 +100”。但对话推进到了更具体的信息，后续报价风险降低。")}else if(n===1)popup("客户反问","`same material? fitment guaranteed?` 你提前报出的价格没有解决规格问题。");else popup("已读","目录太宽，客户没有告诉你他到底看了什么。下次把内容缩到他的车型/需求。");advance(1)}function fitment(){$("#main").innerHTML=`<section class="sheet"><h2>Fitment Lab</h2><p>把“适配”当成一个检查流程，而不是一句 fits all。</p><div class="grid"><div class="card"><h3>车辆</h3><p>2024 BMW M4 G82 Competition</p></div><div class="card"><h3>客户要</h3><p>Dry carbon front lip</p></div><div class="card"><h3>供应商标题</h3><p>G82 M4 2021–2024 carbon front lip</p></div></div><h3>你还要检查什么？</h3><button class="quizOption" onclick="fitAnswer(1)">实车前脸 / trim / 安装案例 / actual product photos</button><button class="quizOption" onclick="fitAnswer(0)">标题已经写 2021–2024，直接保证适配</button></section>`}function fitAnswer(ok){if(ok){S.skill++;S.tasks.learn=true;popup("Fitment 推进","对。标题是检索入口，不是最终适配证明。")}else popup("风险留下了","如果版本或前杠结构不同，问题会在安装时爆出来，而不是在网页标题里。");save()}function inventory(){$("#main").innerHTML=`<section class="sheet"><h2>库存 / 报价台</h2><div class="grid">${S.stock.map((x,i)=>`<div class="card"><h3>${x[0]}</h3><p>库存 ${x[1]} · 成本 ¥${x[2]} · 参考销售 ¥${x[3]}</p><p>毛利/件 ¥${x[3]-x[2]}</p><button class="pink" onclick="sell(${i})">模拟出 1 件</button></div>`).join("")}</div><p class="small">这里暂未计入真实运费、平台费、包装和售后成本；后续版本继续加入。</p></section>`}function sell(i){let x=S.stock[i];if(x[1]<=0){popup("没库存","不能继续承诺 ready stock。");return}x[1]--;S.money+=x[3]-x[2];S.biz++;S.tasks.biz=true;S.logs.unshift(`模拟销售：${x[0]}`);advance(1);inventory()}function calendar(){let days=Array.from({length:28},(_,i)=>i+1);$("#main").innerHTML=`<section class="sheet"><h2>培训日历</h2><div class="calendar">${days.map(d=>`<div class="day ${d===S.day?"today":""}">D${d}<br><small>${d<=10?"广州基础":d<=20?"广州进阶":"迪拜准备"}</small></div>`).join("")}</div><p>不是第 10 天就结局。训练会逐步从认件 → 询盘 → fitment → 报价 → 展会 → 售后 → 独立客户推进。</p></section>`}function log(){$("#main").innerHTML=`<section class="sheet"><h2>生活 / 工作日志</h2>${S.logs.length?S.logs.slice(0,80).map(x=>`<p>• ${x}</p>`).join(""):"<p>还没有记录。</p>"}</section>`}function phone(){$("#phone").style.display=$("#phone").style.display==="block"?"none":"block"}function popup(t,b){$("#mb").innerHTML=`<h2>${t}</h2><p style="font-size:19px;line-height:1.75">${b}</p>`;$("#modal").style.display="block"}function zoom(img){$("#mb").innerHTML=`<img src="${img}" style="width:100%">`;$("#modal").style.display="block"}function closeM(){$("#modal").style.display="none"}function reset(){if(confirm("重置 Build 0.7 存档？")){localStorage.removeItem("cd07");location.reload()}}boot();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
